  ${card('topup','حدود الشحن',`<div class="two">${fld('أقل مبلغ',num('min',t.min||''))}${fld('أكبر مبلغ',num('max',t.max||''))}</div>`+
    fld('المبالغ السريعة',inp('amounts',(t.amounts||[50,100,200]).join('، '),'dir="rtl" placeholder="20، 50، 100، 200"'),'تفصل بينها بفاصلة.'))}
  ${card('margin','تنبيه الهامش',fld('نبّهني لما هامش الربح يقل عن (%)',num('marginAlertPct',priv.marginAlertPct??8,'step="0.5"')),'يُحسب على آخر تكلفة دفعة أكواد مقارنة بسعر البيع الحالي.')}
  ${card('maint','وضع الصيانة',chk('active',m.active,'قفل المتجر للزبائن مؤقتًا')+fld('الرسالة',area('message',m.message,'rows="2"'))+fld('الرسالة بالإنجليزي (اختياري)',area('messageEn',m.messageEn,'rows="2" dir="ltr"')),'الإداريين يقدروا يدخلوا عادي.')}
  </div><div class="stack">
  ${card('bank','بيانات التحويل المصرفي',fld('اسم صاحب الحساب',inp('holder',b.holder))+fld('المصرف',inp('bank',b.bank))+
    `<div class="two">${fld('رقم الحساب',inp('account',b.account,'dir="ltr"'))}${fld('IBAN (اختياري)',inp('iban',b.iban,'dir="ltr"'))}</div>`+
    fld('ملاحظة تظهر للزبون',inp('note',b.note,'placeholder="المراجعة من 9 الصبح لـ 11 الليل"')))}
  <div class="card" id="gwcard"><div class="loader"></div></div>
  ${card('help','المساعدة والشروط',fld('الأسئلة الشائعة',area('help',pub.help,'rows="6"'),'كل سطر: السؤال | الجواب')+fld('الشروط وسياسة الاستخدام',area('terms',pub.terms,'rows="6"'))+`<details class="cfg enbox"><summary>${ic('globe',16)} النسخة الإنجليزية (اختياري)</summary>${fld('FAQ (English)',area('helpEn',pub.helpEn,'rows="5" dir="ltr"'))}${fld('Terms (English)',area('termsEn',pub.termsEn,'rows="5" dir="ltr"'))}</details>`)}
  </div></div>`);

App.saveSet=(id,form)=>act(form.querySelector('button[type=submit]'),async()=>{
  const f=formData(form);const P=d=>S.api.savePublicSettings(d);
  if(id==='store')await P({maxQty:Math.max(1,Math.min(20,Math.floor(+f.maxQty)||10)),storeName:f.storeName.trim()||'Pronto',support:{whatsapp:normPhone(f.whatsapp),phone:normPhone(f.phone),hours:f.hours.trim()}});
  if(id==='bonus'){const amount=r2(f.amount),active=yes(f.active);if(active&&!(amount>0))throw new Error('اكتب مبلغ الهدية');
    await S.api.savePrivateSettings({signupBonus:{active,amount}});await P({signupBonus:active?amount:0});}
  if(id==='topup'){const amounts=(f.amounts||'').split(/[,،\s]+/).map(Number).filter(x=>x>0).slice(0,6);const min=r2(f.min),max=r2(f.max);
    if(min&&max&&min>max)throw new Error('أقل مبلغ أكبر من أكبر مبلغ');await P({topup:{min,max,amounts}});}
  if(id==='margin')await S.api.savePrivateSettings({marginAlertPct:+f.marginAlertPct||0});
  if(id==='maint'){if(yes(f.active)&&!confirm('المتجر حيتقفل على كل الزبائن. متأكد؟'))return;await P({maintenance:{active:yes(f.active),message:f.message.trim(),messageEn:(f.messageEn||'').trim()}});}
  if(id==='bank')await P({bank:{holder:f.holder.trim(),bank:f.bank.trim(),account:f.account.trim(),iban:f.iban.trim(),note:f.note.trim()}});
  if(id==='help')await P({help:f.help.trim(),terms:f.terms.trim(),helpEn:f.helpEn.trim(),termsEn:f.termsEn.trim()});
  await refreshFront();toast('تم الحفظ','ok');
});

App.openCfg=v=>{const d=$('#cfg-'+v);if(d){d.open=true;setTimeout(()=>d.scrollIntoView({behavior:'smooth',block:'start'}),50);}};
App.saveOtpOn=form=>act(form.querySelector('button[type=submit]'),async()=>{const on=yes(formData(form).otp);
  if(!on&&!confirm('بدون تحقق، أي حد يقدر يسجّل برقم مش متاعه. متأكد؟'))return;
  await S.api.savePublicSettings({auth:{...(S.pub.auth||{}),otp:on}});await refreshFront();toast('تم الحفظ','ok');});
App.saveOtp=form=>act(form.querySelector('button[type=submit]'),async()=>{const f=formData(form);
  const channels=[...new Set([f.ch1,f.ch2].filter(Boolean))];
  if(!channels.length)throw new Error('اختر قناة أساسية');
  if(channels.includes('test')&&!confirm('وضع الاختبار ما يبعتش الكود للزبون. نستخدموه للتجربة بس؟'))return;
  if(f.sms_headers){try{JSON.parse(f.sms_headers.replace(/\{\w+\}/g,'x'))}catch(e){throw new Error('صيغة Headers غير صحيحة (لازم JSON)');}}
  await S.api.saveOtpConfig({cfg:{channels,appName:f.appName.trim(),
    whatsapp:{phoneNumberId:f.wa_id.trim(),template:f.wa_tpl.trim(),language:f.wa_lang.trim()||'ar',copyButton:yes(f.wa_copy)},
    sms:{method:f.sms_method,url:f.sms_url.trim(),sender:f.sms_sender.trim(),user:f.sms_user.trim(),headers:f.sms_headers.trim(),body:f.sms_body,message:f.sms_msg.trim(),successText:f.sms_ok.trim()}},
    secrets:{whatsappToken:f.wa_token.trim(),smsKey:f.sms_key.trim(),telegramToken:f.tg_token.trim()}});
  await refreshFront();toast('تم حفظ القنوات','ok');ADMIN.otp();});
App.testOtp=form=>act(form.querySelector('button[type=submit]'),async()=>{const f=formData(form);
  await S.api.testOtp(normPhone(f.phone),f.channel);toast('تم الإرسال، شوف جوالك','ok');ADMIN.otp();});


/* ---------- شحن محفظة زبون (هدية، جائزة مسابقة، تعويض) ---------- */
App.giftOne=async(cid)=>{
  if(!S.cache.custs)try{S.cache.custs=await S.api.listCustomers();}catch(e){return toast(errMsg(e),'bad');}
  const c=cid?(S.cache.custs||[]).find(x=>x.id===cid):null;
  sheet(`<h3 class="shh">${ic('gift',20)} شحن محفظة زبون</h3>
  <p class="mut small" style="margin-top:4px">المبلغ ينضاف فورًا لرصيد الزبون، ويتسجّل في حركاته كهدية.</p>
  <form style="margin-top:14px" onsubmit="event.preventDefault();App.doGiftOne(this)" oninput="App.giftWho(this)">
    ${fld('رقم هاتف الزبون',`<input name="phone" type="tel" inputmode="tel" dir="ltr" list="custlist-dl" placeholder="09xxxxxxxx" value="${esc(c?.phone||'')}" autocomplete="off">
      <datalist id="custlist-dl">${(S.cache.custs||[]).slice(0,500).map(x=>`<option value="${esc(x.phone)}">${esc(x.name)}</option>`).join('')}</datalist>`)}
    <div class="whobox" id="giftwho"></div>
    <div class="field"><label>المبلغ (د.ل)</label><div class="chipsel">${[5,10,20,50,100].map(v=>`<button type="button" class="chip" onclick="this.form.amount.value=${v};App.giftWho(this.form)">${v}</button>`).join('')}</div>
      ${num('amount','','min="0.5" placeholder="أو اكتب مبلغ" style="margin-top:8px"')}</div>
    <div class="field"><label>السبب (يوصل للزبون في الإشعار)</label><div class="chipsel">${['فايز مسابقة 🏆','هدية من برونتو 🎁','تعويض','عرض خاص'].map(r=>`<button type="button" class="chip" onclick="this.form.note.value='${r}'">${r}</button>`).join('')}</div>
      ${inp('note','','maxlength="120" placeholder="مثلًا: فايز مسابقة رمضان" style="margin-top:8px"')}</div>
    ${chk('notify',true,'أرسل له إشعار')}
    <button class="btn" type="submit">${ic('gift',17)} إضافة للمحفظة</button></form>`);
  App.giftWho($('#layer form'));
};
App.giftWho=form=>{const ph=normPhone(form.phone.value),c=(S.cache.custs||[]).find(x=>x.phone===ph),a=r2(form.amount.value),box=$('#giftwho');if(!box)return;
  box.innerHTML=!ph?'':c?`<span class="ico soft">${ic('user',18)}</span><div class="grow"><b>${esc(c.name)}</b><div class="muted tiny">الرصيد الحالي ${fmt(c.balance)} د.ل${a>0?` · بعد الإضافة <b class="num">${fmt(c.balance+a)}</b> د.ل`:''}</div></div>${c.blocked?'<span class="pill bad">موقوف</span>':''}`
    :validPhone(ph)?`<span class="ico" style="background:var(--err-bg);color:var(--err)">${ic('info',18)}</span><div class="grow muted small">ما فيه زبون بهذا الرقم</div>`:'';};
App.doGiftOne=form=>act(form.querySelector('button[type=submit]'),async()=>{
  const f=formData(form),ph=normPhone(f.phone),c=(S.cache.custs||[]).find(x=>x.phone===ph),amount=r2(f.amount),note=(f.note||'').trim();
  if(!c)throw new Error('اختر زبون موجود برقم هاتفه');
  if(!(amount>0))throw new Error('اكتب المبلغ');
  if(!note)throw new Error('اكتب السبب');
  if(!confirm(`نضيف ${fmt(amount)} د.ل لمحفظة ${c.name}؟`))return;
  await S.api.adjustBalance({uid:c.id,amount,type:'gift',note,notify:yes(f.notify)});
  c.balance=r2(c.balance+amount);App.close();toast(`تمت إضافة ${fmt(amount)} د.ل لـ ${c.name}`,'ok');
  if(S.adminTab==='customers')ADMIN.customers();
});

function auditDetail(k,a){try{

  if(k==='adjustBalance'){const o=a[0]||{};return `${cust(o.uid)} · ${o.amount>0?'+':''}${o.amount} د.ل · ${o.note||''}`;}
  if(k==='setBlocked')return `${cust(a[0])} · ${a[1]?'إيقاف':'تفعيل'}`;
  if(k==='saveCustomerNote')return cust(a[0]);

  if(k==='bulkCredit'){const o=a[0]||{};return `${o.amount||''} د.ل · ${o.note||''}`;}

}catch(e){}return '';}
function wrapAudit(api){

    api[k]=function(...a){const who=S.profile?{name:S.profile.name,role:S.profile.role||'admin'}:{name:'',role:''};
      const r=f.apply(api,a);

  <div class="list">${AUDIT.map(x=>`<div class="item"><div class="grow"><div class="t">${esc(AUDIT_LABELS[x.action]||x.action)}</div>
    <div class="muted tiny">${esc(x.who||'')} · ${esc(ROLES[x.role]||x.role||'')} · ${fdate(x.at)}${x.detail?' · '+esc(x.detail):''}</div></div></div>`).join('')||'<div class="empty">ما فيه تعديلات مسجّلة بعد.</div>'}</div>`);
// --- اعتماد جماعي لطلبات الشحن + ملاحظات الزبائن ---
const bulkInner=list=>{const pend=list.filter(t=>t.status==='pending');if(pend.length<2)return '';
  const sel=(S.cache.topSel||[]).filter(id=>pend.some(t=>t.id===id));const tot=pend.filter(t=>sel.includes(t.id)).reduce((a,t)=>a+t.amount,0);
  return `<div class="toolbar" style="margin-bottom:12px"><button class="btn sm ghost" onclick="App.selAllTop()">تحديد الكل (${pend.length})</button>${sel.length?`<button class="btn sm ok" onclick="App.approveSel(this)">اعتماد المحدد (${sel.length}) · ${L(tot)}</button>`:''}</div>`;};
App.selTop=(id,on)=>{const a=new Set(S.cache.topSel||[]);if(on)a.add(id);else a.delete(id);S.cache.topSel=[...a];const el=$('#topbulk');if(el)el.innerHTML=bulkInner(S.cache.topups||[]);};
App.selAllTop=()=>{S.cache.topSel=(S.cache.topups||[]).filter(t=>t.status==='pending').map(t=>t.id);ADMIN.topups();};
App.approveSel=btn=>{const list=S.cache.topups||[];const ids=(S.cache.topSel||[]).filter(id=>list.some(t=>t.id===id&&t.status==='pending'));if(!ids.length)return;
  const tot=list.filter(t=>ids.includes(t.id)).reduce((a,t)=>a+t.amount,0);
  if(!confirm(`نعتمد ${ids.length} طلب بإجمالي ${fmt(tot)} د.ل ونضيف الرصيد للزبائن؟`))return;
  act(btn,async()=>{let ok=0,bad=0;for(const id of ids){try{await S.api.approveTopup(id);ok++;}catch(e){bad++;}}
    S.cache.topSel=[];toast(bad?`اعتُمد ${ok} وفشل ${bad}`:`تم اعتماد ${ok} طلب`,bad?'bad':'ok');ADMIN.topups();});};
App.saveNote=(cid,form)=>act(form.querySelector('button[type=submit]'),async()=>{const t=form.note.value.trim();
  await S.api.saveCustomerNote(cid,t);toast('تم حفظ الملاحظة','ok');});
// --- وصول وأداء: أسماء للأزرار والحقول، تحميل كسول للصور، تنبيه انقطاع الإنترنت ---
function a11yPass(){
  document.querySelectorAll('button:not([aria-label])').forEach(b=>{if(!b.textContent.trim()&&!b.querySelector('img[alt]:not([alt=""])')){const t=b.getAttribute('title');if(t)b.setAttribute('aria-label',t);}});
  document.querySelectorAll('input:not([aria-label]),textarea:not([aria-label]),select:not([aria-label])').forEach(i=>{if(i.type==='hidden'||(i.type==='checkbox'&&i.closest('label')))return;
    const l=i.closest('.field')?.querySelector('label')?.textContent.trim()||i.getAttribute('placeholder');if(l)i.setAttribute('aria-label',l);});
  document.querySelectorAll('img:not([loading])').forEach(i=>{if(!i.closest('#splash'))i.loading='lazy';i.decoding='async';});
  document.querySelectorAll('img:not([alt])').forEach(i=>i.setAttribute('alt',''));
}
{let t;new MutationObserver(()=>{clearTimeout(t);t=setTimeout(a11yPass,150);}).observe(document.body,{childList:true,subtree:true});}
function netBar(){let el=$('#netbar');if(!navigator.onLine){if(!el){el=document.createElement('div');el.id='netbar';el.setAttribute('role','alert');el.textContent='لا يوجد اتصال بالإنترنت';document.body.appendChild(el);}}else if(el)el.remove();}
addEventListener('online',netBar);addEventListener('offline',netBar);netBar();

/* ================== التشغيل ================== */
// شاشة الافتتاح: تبقى ثانيتين على الأقل، وبعدها تختفي بنعومة
const SPLASH_T0 = Date.now();
function hideSplash() {
  const el = $('#splash'); if (!el || el.dataset.out) return; el.dataset.out = '1';
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 600); }, Math.max(0, 2900 - (Date.now() - SPLASH_T0)));
}
(async () => {
  applyTheme();
  try { history.replaceState({s: 'home', d: 0}, ''); } catch (e) {}
  try {
    if (FIREBASE_CONFIG && !/[?&]demo=1\b/.test(location.search)) {
      try { S.api = await createFirebaseApi(FIREBASE_CONFIG); }
      catch (fe) {
        const preview = !/(^|\.)pronto-app\.ly$/.test(location.hostname);
        if (!preview) throw fe;
        console.warn('Firebase غير متاح هنا، تشغيل النسخة التجريبية', fe); S.api = createDemoApi(); }
    } else { S.api = createDemoApi(); }
    wrapAudit(S.api);
    await loadCatalog().catch(e => console.error(e));
  } catch (e) {
    console.error(e); hideSplash(); $('#v').innerHTML = `<div class="empty"><b>تعذّر تحميل التطبيق</b><p>تأكد من الاتصال وحاول مرة ثانية.</p><button class="btn sm" onclick="location.reload()">إعادة المحاولة</button></div>`; return;
  }
  // شاشة الافتتاح تاخذ شعار واسم التطبيق من الإدارة
  applyBrand();
  // لو الإدارة رفعت شعار مخصص، يظهر في شاشة الافتتاح بدل شعار برونتو
  const sp = $('#splash .spin-in');
  if (sp && S.pub.logo) sp.innerHTML = `<span class="splogo2"><img src="${esc(S.pub.logo)}" alt=""></span><b class="spname">${esc(S.pub.storeName || '')}</b>`;
  if (S.api.demo) $('#demo').innerHTML = `<div class="demo">نسخة تجريبية — البيانات وهمية ولا تُحفظ</div>`;
  S.api.onAuth(async user => {
    if (S.authFlow) return; // أثناء التحقق برسالة أو التسجيل نكمّلوا الدخول يدويًا
    if (!user) { S.bootAuth = false; S.profile = null; render(); hideSplash(); return; }
    await onSignedIn(); hideSplash();
  });
  S.bootAuth = true;
})();
</script>
