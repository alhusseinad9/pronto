<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pronto">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<title>Pronto — برونتو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5FA;--card:#FFFFFF;--soft:#E9F0FD;--line:#E8EDF4;
--t1:#0E2545;--t2:#65748B;--t3:#9AA8BC;--blue:#1F5FFF;--navy:#0E2545;--gold:#F0A000;
--ok:#16805C;--ok-bg:#E6F3EE;--warn:#C98A18;--warn-bg:#FAF2E1;--err:#D64545;--err-bg:#FAEBEB;
--sh:0 2px 12px rgba(14,37,69,.07);--shl:0 12px 30px rgba(14,37,69,.12)}
[data-theme="dark"]{--bg:#060B14;--card:#111926;--soft:#18273F;--line:#1D2839;
--t1:#EAF1FA;--t2:#94A6BE;--t3:#6C7F98;--blue:#4E8FF7;--navy:#0B1422;
--ok:#6FD3AC;--ok-bg:#0F3129;--warn:#E3B469;--warn-bg:#2E240F;--err:#F08A8A;--err-bg:#301919;
--sh:0 2px 12px rgba(0,0,0,.4);--shl:0 12px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t1);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
svg{display:block;flex:0 0 auto}
h1,h2,h3,p{margin:0}
.app{max-width:430px;margin:0 auto;min-height:100vh}
#v{padding:0 18px calc(110px + env(safe-area-inset-bottom));animation:in .22s cubic-bezier(.2,.7,.3,1)}
#v.bleed{padding:0 0 calc(110px + env(safe-area-inset-bottom))}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hdr{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 0 12px}
.hi{font-size:13px;color:var(--t2);font-weight:500}
.nm{font-size:22px;font-weight:700;letter-spacing:-.7px;line-height:1.25}
.title{font-size:23px;font-weight:700;letter-spacing:-.7px}
.bal{display:flex;align-items:center;gap:7px;background:var(--card);box-shadow:var(--sh);border-radius:999px;
padding:10px 15px;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;transition:transform .14s}
.bal:active{transform:scale(.95)}
.bal i{width:8px;height:8px;border-radius:999px;background:#22C55E;display:block}
.ib{width:42px;height:42px;border-radius:999px;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;transition:transform .14s}
.ib:active{transform:scale(.92)}
.grow{flex-grow:1}.mut{color:var(--t2);font-size:13px}
.search{display:flex;align-items:center;gap:11px;background:var(--card);box-shadow:var(--sh);border-radius:16px;height:52px;padding:0 16px}
.search input{flex-grow:1;border:0;background:none;outline:none;font-size:14.5px}
.search input::placeholder{color:var(--t3)}
.sec{margin-top:26px}
.sec .h{display:flex;align-items:baseline;gap:8px;margin-bottom:13px}
.sec h2{font-size:18px;font-weight:700;letter-spacing:-.5px}
.more{margin-inline-start:auto;font-size:13px;font-weight:600;color:var(--blue)}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs>*{flex:0 0 auto;scroll-snap-align:center}
.hero{width:calc(100vw - 36px);max-width:394px;aspect-ratio:16/9;border-radius:22px;overflow:hidden;position:relative;
display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff;box-shadow:var(--shl)}
.hero .bgw{position:absolute;inset:0;z-index:0}
.hero .ov{position:absolute;inset:0;background:linear-gradient(160deg,rgba(6,14,28,.22),rgba(6,14,28,.78));z-index:1}
.hero .in{position:relative;z-index:2}
.hero .tag{display:inline-block;background:var(--gold);color:#2A1A00;font-size:11px;font-weight:700;padding:4px 10px;border-radius:7px;margin-bottom:9px}
.hero b{display:block;font-size:22px;font-weight:700;letter-spacing:-.6px;line-height:1.35;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.hero span{display:block;font-size:12.5px;opacity:.9;margin-top:5px}
.hero .cta{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#0E2545;font-size:13.5px;font-weight:700;
padding:11px 18px;border-radius:12px;margin-top:14px;align-self:flex-start;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dots i{width:7px;height:7px;border-radius:999px;background:var(--line);display:block;transition:all .25s}
.dots i.on{width:22px;background:var(--blue)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px -18px 0;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--t2);background:var(--card);box-shadow:var(--sh);padding:10px 16px;border-radius:999px}
.chip[data-on="1"]{background:var(--navy);color:#fff}
[data-theme="dark"] .chip[data-on="1"]{background:var(--blue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.pcard{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--sh);transition:transform .15s}
.pcard:active{transform:scale(.97)}
.pcard .art{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;background:transparent;padding:14px}
.pcard .art .circle{width:100%;aspect-ratio:1/1;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff;
box-shadow:0 0 0 3px var(--card),0 0 0 5px currentColor,var(--sh);position:relative}
.pcard .art .ring{position:absolute;inset:8px;border-radius:999px;box-shadow:0 0 0 3px var(--card)}
.pcard .art .lbl{position:absolute;bottom:10px;inset-inline-start:10px;font-size:11.5px;font-weight:700;opacity:.9}
.pcard .meta{padding:11px 13px 13px}
.pcard b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.2px}
.pcard small{display:block;font-size:12.5px;color:var(--t2);margin-top:3px;font-variant-numeric:tabular-nums}
.tag2{position:absolute;top:10px;inset-inline-end:10px;background:rgba(255,255,255,.92);color:#0E2545;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:7px}
.out{opacity:.45}
.g1{background:linear-gradient(145deg,#12213C,#1D63D1)}.g2{background:linear-gradient(145deg,#111827,#374151)}
.g3{background:linear-gradient(145deg,#4C1D95,#C026D3)}.g4{background:linear-gradient(145deg,#064E3B,#10B981)}
.g5{background:linear-gradient(145deg,#7C2D12,#F59E0B)}.g6{background:linear-gradient(145deg,#0C4A6E,#0EA5E9)}
.strip{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--navy),#1B3F72);color:#fff;
border-radius:18px;padding:15px 16px;box-shadow:var(--sh)}
.strip b{font-size:15px;font-weight:700;display:block}
.strip span{font-size:12.5px;opacity:.8}
.strip .go{background:rgba(255,255,255,.16);padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:700}
.list{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:13px;width:100%;padding:14px 15px}
.row+.row{box-shadow:0 -1px 0 var(--line)}
.row:active{background:var(--bg)}
.row b{display:block;font-size:14.5px;font-weight:600}
.row small{display:block;font-size:12.5px;color:var(--t2);margin-top:2px}
.ico{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff}
.ico.soft{background:var(--soft);color:var(--blue)}
.phero{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;color:#fff;position:relative}
.pback{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-start:16px;background:rgba(255,255,255,.94);color:#0E2545;z-index:3}
.lift{margin-top:-26px;border-radius:26px 26px 0 0;background:var(--bg);position:relative;z-index:2;padding:20px 18px 0}
.pk{background:var(--card);border-radius:16px;padding:14px;text-align:center;box-shadow:var(--sh);outline:2px solid transparent;transition:all .15s}
.pk[data-on="1"]{outline-color:var(--blue);background:var(--soft)}
.pk b{display:block;font-size:15px;font-weight:700}
.pk span{display:block;font-size:13px;color:var(--t2);margin-top:4px;font-variant-numeric:tabular-nums}
.pk.out{opacity:.6;position:relative}
.grid.g3{grid-template-columns:repeat(3,1fr);gap:10px}
.pk{position:relative;overflow:hidden}
.soldout{position:absolute;inset-inline:0;bottom:0;background:var(--err);color:#fff;font-size:10px;font-weight:700;
font-style:normal;padding:3px 0;text-align:center;letter-spacing:-.2px}
.pk.out span{opacity:.5}
.welcome{min-height:100vh;display:flex;flex-direction:column}
.wtop{position:relative;height:36vh;min-height:230px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wcard{position:absolute;width:220px;aspect-ratio:16/10;border-radius:20px;overflow:hidden;color:#fff;
box-shadow:0 18px 40px rgba(14,37,69,.25)}
.wcard .wm{position:absolute;inset-inline-end:-20px;bottom:-26px;opacity:.2}
.wcard .denom{position:absolute;top:16px;inset-inline-start:18px;font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1}
.wcard .denom i{display:block;font-style:normal;font-size:11px;font-weight:600;opacity:.85;margin-top:5px;letter-spacing:0}
.wcard .chip2{position:absolute;bottom:16px;inset-inline-start:18px;width:30px;height:21px;border-radius:5px;
background:linear-gradient(135deg,#F7D774,#C9A227)}
.wcard{transform:rotate(-8deg) translateX(26px)}
.wcard.c2{transform:rotate(4deg) translate(-14px,14px);z-index:2}
.wcard.c3{transform:rotate(12deg) translate(-52px,30px);z-index:1;opacity:.92}
.wbody{flex-grow:1;padding:14px 22px calc(26px + env(safe-area-inset-bottom))}
.wtitle{font-size:30px;font-weight:700;letter-spacing:-1.2px;line-height:1.3;margin:0}
.wsub{margin-top:12px;font-size:14.5px;color:var(--t2);line-height:1.85}
.wfeat{margin-top:20px;background:var(--card);border-radius:20px;padding:4px 16px;box-shadow:var(--sh)}
.wrow{display:flex;align-items:center;gap:13px;padding:14px 0}
.wrow+.wrow{border-top:1px solid var(--line)}
.wrow b{display:block;font-size:14.5px;font-weight:600}
.wrow small{display:block;font-size:12.5px;color:var(--t2);margin-top:2px}
.wnote{margin-top:14px;font-size:11.5px;color:var(--t3);text-align:center}
.packtop{position:relative;padding:calc(16px + env(safe-area-inset-top)) 18px 0;display:flex;justify-content:center}
.packtop .pback{position:absolute;top:calc(16px + env(safe-area-inset-top));inset-inline-start:18px;z-index:3}
.bigcard{position:relative;width:100%;max-width:340px;aspect-ratio:16/10;border-radius:22px;overflow:hidden;color:#fff;
box-shadow:0 18px 40px rgba(14,37,69,.22);margin-top:8px}
.bigcard .wm{position:absolute;inset-inline-end:-24px;bottom:-30px;opacity:.2}
.bigcard .denom{position:absolute;top:20px;inset-inline-start:22px;font-size:40px;font-weight:700;letter-spacing:-1.6px;line-height:1}
.bigcard .denom i{display:block;font-style:normal;font-size:14px;font-weight:600;opacity:.85;margin-top:6px;letter-spacing:0}
.bigcard .chip2{position:absolute;bottom:22px;inset-inline-start:22px;width:38px;height:27px;border-radius:6px;
background:linear-gradient(135deg,#F7D774,#C9A227)}
.bigcard .brand{position:absolute;bottom:24px;inset-inline-end:22px;font-size:13px;font-weight:700;opacity:.9}
.packbody{padding:24px 18px 0}
.price{font-size:30px;font-weight:700;letter-spacing:-1.2px;color:var(--blue);margin-top:8px;font-variant-numeric:tabular-nums}
.feat{margin-top:20px;background:var(--card);border-radius:18px;padding:6px 16px;box-shadow:var(--sh)}
.frow{display:flex;align-items:center;gap:12px;padding:13px 0;font-size:14px}
.frow+.frow{border-top:1px solid var(--line)}
.fi{width:34px;height:34px;border-radius:11px;background:var(--soft);color:var(--blue);display:flex;align-items:center;justify-content:center}
.paybar{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:var(--card);
border-radius:24px 24px 0 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 26px rgba(14,37,69,.12);z-index:18}
.pbtop{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.ptot{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.8px}
.pbrow{display:flex;align-items:center;gap:12px}
.pbrow .btn{height:54px;font-size:15.5px}
.qline{display:flex;align-items:center;gap:12px;padding:4px 0 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.stp{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:13px;padding:5px}
.stp b{min-width:30px;text-align:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.sbtn{width:38px;height:38px;border-radius:10px;background:var(--card);color:var(--t1);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);transition:transform .14s}
.sbtn:active{transform:scale(.9)}.sbtn[disabled]{opacity:.35;box-shadow:none}
.ovl{position:fixed;inset:0;background:rgba(9,18,32,.5);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;
animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.bs{background:var(--bg);width:100%;max-width:430px;margin:0 auto;border-radius:26px 26px 0 0;
padding:14px 20px calc(24px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.bsh{width:40px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 16px}
.bsrow{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:16px;padding:12px;margin-bottom:14px;box-shadow:var(--sh)}
.spin{width:17px;height:17px;border-radius:999px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.pos{color:var(--ok)}
.pkgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.pkt{background:var(--card);border-radius:20px;padding:10px;box-shadow:var(--sh);outline:2px solid transparent;transition:all .16s}
.pkt:active{transform:scale(.97)}
.pkt[data-on="1"]{outline-color:var(--blue);background:var(--soft)}
.cardart{display:block;position:relative;aspect-ratio:16/10;border-radius:13px;overflow:hidden;color:#fff}
.cardart .wm{position:absolute;inset-inline-end:-14px;bottom:-16px;opacity:.22}
.cardart .denom{position:absolute;top:11px;inset-inline-start:12px;font-size:21px;font-weight:700;letter-spacing:-.8px;
line-height:1;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.cardart .denom i{display:block;font-style:normal;font-size:10.5px;font-weight:600;opacity:.85;margin-top:3px;letter-spacing:0}
.cardart .chip2{position:absolute;bottom:12px;inset-inline-start:12px;width:24px;height:17px;border-radius:4px;
background:linear-gradient(135deg,#F7D774,#C9A227);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cardart .tick{position:absolute;top:8px;inset-inline-end:8px;width:24px;height:24px;border-radius:999px;background:var(--blue);
display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.cardart .veil{position:absolute;inset:0;background:rgba(9,18,32,.62);display:flex;align-items:center;justify-content:center;
font-size:12.5px;font-weight:700}
.pkinfo{display:block;padding:10px 4px 4px}
.pkinfo b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.2px}
.pkinfo .pr{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.3px}
.pkt.off{opacity:.55}
.pkt.off .pr{color:var(--t2)}

.qtybar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:17px;
padding:8px 10px;box-shadow:var(--sh)}
.qtybar b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
.qbtn{width:46px;height:46px;border-radius:14px;background:var(--soft);color:var(--blue);display:flex;align-items:center;justify-content:center;transition:transform .14s}
.qbtn:active{transform:scale(.9)}
.qbtn[disabled]{opacity:.35}
.codes{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.codeline{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:12px;padding:11px 13px}
.codeline .cv{flex-grow:1;font-family:ui-monospace,monospace;font-size:14px;color:#fff;word-break:break-all;text-align:right}
.codeline button{width:auto;height:auto;padding:7px 11px;border-radius:9px;font-size:12px;background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.f{display:block;margin-top:18px}
.f>span{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
.f input{width:100%;height:54px;border:0;border-radius:16px;background:var(--card);box-shadow:var(--sh);padding:0 16px;font-size:15px;outline:none}
.sum{background:var(--card);border-radius:20px;padding:16px;margin-top:16px;box-shadow:var(--sh)}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
.kv span{color:var(--t2)}.kv b{font-variant-numeric:tabular-nums}
.tot{border-top:1px solid var(--line);margin-top:9px;padding-top:12px;font-size:16px;font-weight:700}
.dock{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:0;right:0;max-width:430px;margin:0 auto;padding:0 18px;z-index:16}
.dock.low{bottom:calc(18px + env(safe-area-inset-bottom))}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:17px;
background:var(--blue);color:#fff;font-size:16px;font-weight:700;box-shadow:0 12px 26px rgba(29,99,209,.3);transition:transform .14s}
.btn:active{transform:scale(.985)}
.btn.sec{background:var(--card);color:var(--t1);box-shadow:var(--sh);font-weight:600}
.btn[disabled]{opacity:.45;box-shadow:none}
.badge{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.codebox{background:linear-gradient(120deg,var(--navy),#17325C);border-radius:20px;padding:18px;margin-top:18px}
.codebox .k{font-size:12px;color:#9DB2CE}
.codebox .v{font-family:ui-monospace,monospace;font-size:19px;font-weight:700;color:#fff;letter-spacing:1px;margin:10px 0 14px;word-break:break-all}
.codebox button{width:100%;height:48px;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-size:14px;font-weight:600}
.okic{width:72px;height:72px;border-radius:999px;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto;animation:pop .4s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:none;opacity:1}}
.empty{text-align:center;padding:60px 14px}
.empty b{display:block;font-size:17px;font-weight:700}
.empty p{margin-top:8px;font-size:13.5px;color:var(--t2)}
.empty .btn{width:auto;display:inline-flex;padding:0 24px;height:48px;margin-top:18px}
.note{background:var(--card);border-radius:18px;padding:16px;font-size:13.5px;color:var(--t2);line-height:1.85;margin-top:16px;box-shadow:var(--sh)}
.bankrow{display:flex;justify-content:space-between;padding:10px 0;font-size:14px}
.bankrow+.bankrow{border-top:1px solid var(--line)}
.up{border:1.5px dashed var(--line);border-radius:18px;padding:24px;text-align:center;margin-top:16px;color:var(--t2);font-size:13.5px}

function compressImage(file, max = 1100, q = .72, type = 'image/jpeg') {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('اختر صورة'));
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d');
      if (type === 'image/jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
      x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      let out = c.toDataURL(type, q);
      if (type === 'image/webp' && !out.startsWith('data:image/webp')) out = c.toDataURL('image/png');
      res(out);
    };
    img.onerror = () => rej(new Error('تعذّر قراءة الصورة'));
    img.src = URL.createObjectURL(file);
  });
}

async function createFirebaseApi(cfg) {
  const [appM, authM, fs, fn] = await Promise.all([
    import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'),
    import(SDK + 'firebase-firestore.js'), import(SDK + 'firebase-functions.js'),
  ]);
  const app = appM.initializeApp(cfg);
  const auth = authM.getAuth(app);
  const db = fs.getFirestore(app);
  const functions = fn.getFunctions(app, REGION);
  // دوال الدخول تمرّ عبر Cloudflare Worker (بدون Blaze)، والباقي على Cloud Functions
  const WORKER = 'https://pronto-otp.alhussein-ad9.workers.dev';
  const W_FN = new Set(['checkPhone', 'requestOtp', 'verifyOtp', 'completeSignup', 'resetPassword', 'registerProfile',
    'updateProfile', 'purchase', 'revealCode', 'getOrderLogs', 'submitTopup', 'approveTopup', 'rejectTopup', 'refundOrder',
    'adjustBalance', 'bulkCredit', 'setBlocked', 'addBatch']);

  const call = async (name, data) => {
    if (!W_FN.has(name)) return fn.httpsCallable(functions, name)(data).then(r => r.data);
    const h = {'Content-Type': 'application/json'};
    if (auth.currentUser) h.Authorization = 'Bearer ' + await auth.currentUser.getIdToken();
    let r; try { r = await fetch(WORKER + '/' + name, {method: 'POST', headers: h, body: JSON.stringify(data || {})}); }
    catch (e) { throw new Error('تعذّر الاتصال بالخادم، تحقق من الإنترنت'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || 'حدث خطأ، حاول لاحقاً');
    return j;
  };
  const {doc, getDoc, getDocs, collection, query, where, orderBy, limit, updateDoc, setDoc, addDoc, deleteDoc, serverTimestamp} = fs;
  const list = async q => (await getDocs(q)).docs.map(d => ({id: d.id, ...d.data()}));
  const uid = () => auth.currentUser.uid;
  const bySort = a => a.sort((x, y) => (x.sort ?? 0) - (y.sort ?? 0));
  const save = async (col, o) => { const {id, ...data} = o;
    if (id) { await updateDoc(doc(db, col, id), data); return id; }
    return (await addDoc(collection(db, col), {...data, createdAt: serverTimestamp()})).id; };
  return {
    demo: false,
    onAuth: cb => authM.onAuthStateChanged(auth, cb),
    signIn: (phone, password) => authM.signInWithEmailAndPassword(auth, synthEmail(phone), password),
    signOut: () => authM.signOut(auth),
    checkPhone: phone => call('checkPhone', {phone}).then(r => r.exists),
    // كود التحقق من نظامنا على السيرفر (واتساب / رسالة نصية / تيليغرام)
    requestOtp: (phone, purpose, channel) => call('requestOtp', {phone, purpose, channel}),
    verifyOtp: (phone, code) => call('verifyOtp', {phone, code}).then(r => r.ticket),
    async completeSignup(d) {
      const r = await call('completeSignup', d);
      await authM.signInWithEmailAndPassword(auth, synthEmail(d.phone), d.password);
      return r;
    },
    async signUpNoOtp({name, phone, email, password}) {
      await authM.createUserWithEmailAndPassword(auth, synthEmail(phone), password);
      return call('registerProfile', {name, phone, email});
    },
    async resetPassword(d) {
      await call('resetPassword', d);
      await authM.signInWithEmailAndPassword(auth, synthEmail(d.phone), d.password);
    },

      D.otp.recent.unshift({phone, channel: ch, ok: true, createdAt: now()});
      return {channel: ch, channelName: {whatsapp: 'واتساب', sms: 'رسالة نصية', telegram: 'تيليغرام', test: 'وضع الاختبار'}[ch], alternatives: chs.filter(c => c !== ch && c !== 'test'), resendIn: 60};
    }),
    verifyOtp: (phone, code) => tryy(() => {
      if (normPhone(phone) !== otpPhone) throw new Error('اطلب كود جديد');
      if (code !== '123456') throw new Error('الرمز غير صحيح، تحقق منه وحاول مجدداً');
      otpOk = true; return 'demo-ticket';
    }),
    completeSignup: ({phone, ticket, name, email, password}) => tryy(() => {
      if (!otpOk || otpPurpose !== 'signup' || ticket !== 'demo-ticket') throw new Error('انتهت صلاحية التحقق، اطلب كود جديد');
      return makeUser({name, phone, email, password, verified: true});
    }),
    signUpNoOtp: ({name, phone, email, password}) => tryy(() => makeUser({name, phone, email, password, verified: false})),
    resetPassword: ({phone, ticket, password}) => tryy(() => {
      if (!otpOk || otpPurpose !== 'reset' || ticket !== 'demo-ticket') throw new Error('انتهت صلاحية التحقق، اطلب كود جديد');
      const u = D.customers.find(c => c.phone === normPhone(phone)); if (!u) throw new Error('لا يوجد حساب بهذا الرقم');
      u.password = password; u.phoneVerified = true; cur = u; signed = true; otpOk = false; setTimeout(() => authCb({uid: u.id}));
    }),
    paymentStatus: pid => wait(D.payments.find(p => p.id === pid) || null),
    listPayments: () => wait(D.payments),
    gatewayStatus: () => wait(Object.fromEntries((D.pub.gatewayList || []).map(g => [g.id, {linked: false, keys: Object.keys(D.gwSecrets[g.id] || {})}]))),
    saveGatewaySecrets: (gid, fields) => tryy(() => { D.gwSecrets[gid] = {...(D.gwSecrets[gid] || {}), ...Object.fromEntries(Object.entries(fields).filter(([k, v]) => v && !String(v).startsWith('••••')))}; }),
    projectId: 'demo',
    getOtpConfig: () => wait({cfg: D.otp.cfg, secrets: D.otp.masked, stats: {test: {ok: D.otp.recent.length, fail: 0}}, recent: D.otp.recent.slice(0, 15),
      outbox: D.otp.recent.filter(x => x.channel === 'test').slice(0, 10).map(x => ({phone: x.phone, code: '123456', createdAt: x.createdAt}))}),
    saveOtpConfig: ({cfg, secrets}) => tryy(() => { D.otp.cfg = clone(cfg);
      Object.entries(secrets || {}).forEach(([k, v]) => { if (v && !v.startsWith('••••')) D.otp.masked[k] = '••••' + v.slice(-4); });
      D.pub.auth = {...(D.pub.auth || {}), channels: cfg.channels.filter(c => c !== 'test')}; }),
    testOtp: (phone, channel) => tryy(() => { if (channel !== 'test') throw new Error('فشل الإرسال: في النسخة التجريبية القنوات الحقيقية ما تشتغلش، تشتغل بعد ربط Firebase'); D.otp.recent.unshift({phone: normPhone(phone), channel, ok: true, test: true, createdAt: now()}); }),
    signIn: (phone, password) => tryy(() => {
      const u = D.customers.find(c => c.phone === normPhone(phone));
      if (!u || (u.password && u.password !== password)) { const e = new Error('رقم الهاتف أو كلمة المرور غير صحيحة'); throw e; }
      cur = u; signed = true; setTimeout(() => authCb({uid: u.id}));
    }),
    demoAdmin: async () => { cur = me; signed = true; authCb({uid: me.id}); },
    demoRole: async r => { cur = staff[r]; signed = true; authCb({uid: cur.id}); },
    signOut: async () => { signed = false; authCb(null); },
    updateProfile: ({name, email}) => tryy(() => { if (!name) throw new Error('أدخل اسمك');
      if (email && !/^\S+@\S+\.\S+$/.test(email)) throw new Error('البريد الإلكتروني غير صحيح'); cur.name = name; cur.email = email || ''; }),
    changePassword: (phone, current, next) => tryy(() => { if (cur.password && cur.password !== current) throw new Error('كلمة المرور الحالية غير صحيحة'); cur.password = next; }),
    getProfile: () => wait({...cur, isAdmin: cur === me || !!cur.role}),
    getCatalog: () => wait({brands: [...D.brands].sort((a, b) => a.sort - b.sort), products: [...D.products].sort((a, b) => a.sort - b.sort),
      banners: [...D.banners].sort((a, b) => a.sort - b.sort), pub: D.pub}),
    purchase: (productId, expected, qty = 1) => tryy(() => { checkOpen();
      const mx = Math.min(20, +D.pub.maxQty || 10); qty = Math.floor(+qty || 1);
      if (qty < 1 || qty > mx) throw new Error(`يمكنك شراء من 1 إلى ${mx} بطاقات في الطلب الواحد`);
      const p = D.products.find(x => x.id === productId); if (!p) throw new Error('هذا الكرت غير متاح');
      const avail = D.codes.filter(x => x.productId === productId && x.status === 'available').length;
      if (avail < qty) throw new Error(avail ? `المتوفر حالياً ${avail} فقط من هذه الفئة` : 'نفدت هذه البطاقة من المخزون');
      if (cur.balance < eff(p) * qty) throw new Error('رصيدك لا يكفي لهذا الطلب');
      const os = []; for (let i = 0; i < qty; i++) os.push(sell(cur, productId, now(), expected));
      return {orderIds: os.map(o => o.id), orderId: os[0].id, price: os[0].price, qty, total: r2(os[0].price * qty), balance: cur.balance}; }),
    myOrders: () => wait(D.orders.filter(o => o.uid === cur.id).map(({code, ...o}) => o)),
    revealCode: orderId => wait((() => { D.accessLogs.push({orderId, byAdmin: cur === me, at: now()}); return D.orders.find(o => o.id === orderId)?.code; })()),
    orderLogs: orderId => wait(D.accessLogs.filter(l => l.orderId === orderId)),
    submitTopup: d => tryy(() => { checkOpen(); lim(+d.amount); if (cur.blocked) throw new Error('حسابك موقوف، تواصل مع الدعم');
      const t = {id: id('t'), uid: cur.id, name: cur.name, phone: cur.phone, amount: r2(d.amount), method: 'bank', reference: d.reference, status: 'pending', createdAt: now()};
      D.topups.unshift(t); D.receipts[t.id] = d.image; return {id: t.id}; }),
    myTopups: () => wait(D.topups.filter(t => t.uid === cur.id)),
    myLedger: () => wait(D.ledger[cur.id] || []),
    myNotifications: () => wait(D.notifications.filter(x => x.target === 'all' || x.target === cur.id)),
    startGatewayTopup: (gateway, amount, fields) => tryy(() => { checkOpen(); lim(+amount);
      const gw = (D.pub.gatewayList || []).find(g => g.id === gateway && g.active); if (!gw) throw new Error('طريقة الدفع هذه غير متاحة');
      D.payments.unshift({id: id('pay'), uid: cur.id, name: cur.name, phone: cur.phone, gateway, gatewayName: gw.name, amount: +amount, status: 'paid', createdAt: now()});
      cur.balance = r2(cur.balance + +amount);
      Lg(cur.id, {type: 'topup', method: gateway, amount: +amount, balanceAfter: cur.balance, note: 'شحن إلكتروني'});
      Nt(cur.id, 'تم شحن محفظتك ✅', `أضفنا ${amount} د.ل لرصيدك.`, {type: 'screen', value: 'wallet'}); return {credited: true}; }),
    // الإدارة
    saveBrand: b => tryy(() => { if (!b.id && !b.name) throw new Error('اكتب اسم المنتج');
      const idd = saveIn(D.brands, 'br', b); if (b.name) D.products.filter(p => p.brandId === idd).forEach(p => p.brand = b.name); return idd; }),
    deleteBrand: bid => tryy(() => { if (D.products.some(p => p.brandId === bid)) throw new Error('المنتج فيه فئات، أخفيه بدل الحذف'); D.brands = D.brands.filter(b => b.id !== bid); }),
    saveProduct: p => tryy(() => saveIn(D.products, 'p', p.id ? p : {...p, stock: 0})),
    saveBanner: b => tryy(() => saveIn(D.banners, 'bn', b)),
    deleteBanner: bid => tryy(() => { D.banners = D.banners.filter(b => b.id !== bid); }),
    addBatch: d => tryy(() => addBatch(d)),
    listBatches: () => wait(D.batches),
    listTopups: s => wait(D.topups.filter(t => !s || t.status === s).sort((a, b) => b.createdAt - a.createdAt)),
    getReceipt: tid => wait(D.receipts[tid]),
    approveTopup: tid => tryy(() => { const t = D.topups.find(x => x.id === tid); if (t.status !== 'pending') throw new Error('تمت معالجة هذا الطلب مسبقًا');
      const u = find(t.uid); t.status = 'approved'; u.balance = r2(u.balance + t.amount);
      Lg(u.id, {type: 'topup', method: 'bank', amount: t.amount, balanceAfter: u.balance, note: 'تحويل مصرفي'});
      Nt(u.id, 'تم شحن محفظتك ✅', `أضفنا ${t.amount} د.ل لرصيدك.`, {type: 'screen', value: 'wallet'}); }),
    rejectTopup: (tid, reason) => tryy(() => { const t = D.topups.find(x => x.id === tid); if (t.status !== 'pending') throw new Error('تمت معالجة هذا الطلب مسبقًا');
      t.status = 'rejected'; t.reason = reason; Nt(t.uid, 'طلب الشحن مرفوض', reason, {type: 'screen', value: 'wallet'}); }),
    listOrders: () => wait(D.orders.map(({code, ...o}) => o)),
    refundOrder: (oid, reason) => tryy(() => { const o = D.orders.find(x => x.id === oid); if (o.status === 'refunded') throw new Error('هذا الطلب مسترجع من قبل');
      if (!reason) throw new Error('اكتب سبب الاسترجاع');
      const u = find(o.uid); u.balance = r2(u.balance + o.price); o.status = 'refunded'; o.refundReason = reason; o.profit = 0;
      Lg(u.id, {type: 'refund', amount: o.price, balanceAfter: u.balance, note: `استرجاع: ${o.productName}`});
      Nt(u.id, 'رجعنا قيمة طلبك', `${o.price} د.ل رجعت لمحفظتك — ${reason}`, {type: 'screen', value: 'wallet'}); }),
    listCustomers: () => wait(D.customers),
    customerLedger: u => wait(D.ledger[u] || []),
    adjustBalance: ({uid, amount, type, note, notify}) => tryy(() => { const u = find(uid); amount = r2(amount);
      if (!amount) throw new Error('المبلغ غير صحيح'); if (!note) throw new Error('اكتب السبب');
      if (type === 'gift' && amount < 0) throw new Error('الهدية لازم تكون مبلغ موجب');
      const nb = r2(u.balance + amount); if (nb < 0) throw new Error('الرصيد لا يمكن أن يصبح سالبًا');
      u.balance = nb; Lg(uid, {type: type === 'gift' ? 'gift' : 'adjust', amount, balanceAfter: nb, note});
      if (notify !== false && amount > 0) Nt(uid, type === 'gift' ? 'وصلتك هدية 🎁' : 'تحديث في رصيدك', `${note} — أضفنا ${amount} د.ل لمحفظتك.`, {type: 'screen', value: 'wallet'}); }),
    bulkCredit: ({target, phones, amount, note, notify}) => tryy(() => { amount = r2(amount);
      if (!(amount > 0)) throw new Error('المبلغ غير صحيح'); if (!note) throw new Error('اكتب سبب الهدية');
      let users = [], missing = [];
      if (target === 'all') users = D.customers;
      else { const ph = [...new Set((phones || []).map(normPhone).filter(Boolean))]; if (!ph.length) throw new Error('أضف رقم هاتف واحد على الأقل');
        users = D.customers.filter(c => ph.includes(c.phone)); missing = ph.filter(p => !users.some(u => u.phone === p)); }
      users = users.filter(u => !u.blocked);
      users.forEach(u => { u.balance = r2(u.balance + amount); Lg(u.id, {type: 'gift', amount, balanceAfter: u.balance, note});
        if (notify !== false) Nt(u.id, 'وصلتك هدية 🎁', `${note} — أضفنا ${amount} د.ل لمحفظتك.`, {type: 'screen', value: 'wallet'}); });
      D.giftRuns.unshift({id: id('g'), amount, note, count: users.length, total: r2(amount * users.length), target, createdAt: now()});
      return {count: users.length, total: r2(amount * users.length), missing}; }),
    listGiftRuns: () => wait(D.giftRuns),
    setBlocked: (u, blocked) => tryy(() => { find(u).blocked = !!blocked; }),
    saveCustomerNote: (u, text) => tryy(() => { find(u).adminNote = text; }),
    getCustomerNote: u => tryy(() => find(u).adminNote || ''),
    sendNotification: x => tryy(() => { Nt(x.target, x.title, x.body, x.action); }),
    listNotifications: () => wait(D.notifications),
    deleteNotification: nid => tryy(() => { D.notifications = D.notifications.filter(x => x.id !== nid); }),
    getPrivateSettings: () => wait(D.priv),
    savePrivateSettings: d => tryy(() => { Object.assign(D.priv, d); }),
    getPublicSettings: () => wait(D.pub),
    savePublicSettings: d => tryy(() => { Object.assign(D.pub, clone(d)); }),
  };
}

const S={api:null,profile:null,brands:[],products:[],banners:[],pub:{},notifs:[],screen:'home',ctx:null,stack:[],cat:0,q:'',
  authStep:'phone',authMode:'in',adminTab:'dash',cache:{},topAmount:0,last:null,hero:0,
  theme:store.get('th')||'system'};
const App=window.App={};window.S=S;
App.close=()=>{$('#layer').innerHTML='';};
const BACKS={brand:'home',pack:'brand',order:'orders',bank:'topup',gwpay:'topup',topup:'wallet',ledger:'wallet',mytopups:'wallet',notifications:'home',offers:'home',page:'home',help:'account',terms:'account'};
// التنقّل مربوط بسجل المتصفح عشان زر الرجوع في الجوال (أندرويد) يرجّع خطوة بدل ما يسكّر التطبيق
App.go=(s,c,fromPop)=>{$$('.toast').forEach(x=>x.remove());App.close();S.screen=s;S.ctx=c===undefined?null:c;
  if(!fromPop){const d=(history.state?.sid===S.sid?history.state.d||0:0)+1;try{history.pushState({s,c:S.ctx,t:S.adminTab,d,sid:S.sid},'');}catch(e){}}
  window.scrollTo(0,0);render();};
App.back=()=>{if(S.screen==='bank'&&(S.bankStep||1)>1){S.bankStep--;render();return;}
  if(history.state?.sid===S.sid&&(history.state?.d||0)>0)history.back();else App.go(BACKS[S.screen]||'home',S.screen==='pack'?S.backBrand:undefined);};
window.addEventListener('popstate',e=>{
  if($('#layer').innerHTML){App.close();try{history.pushState({s:S.screen,c:S.ctx,t:S.adminTab,d:(e.state?.d||0)+1},'');}catch(x){}return;}
  if(!S.profile){if(S.authStep!=='phone')App.authBack();return;}
  const st=e.state||{};
  // حالة من جلسة قديمة (قبل تسجيل الخروج): نرجعوا للرئيسية
  if(st.sid!==S.sid){try{history.replaceState({s:'home',d:0,sid:S.sid},'');}catch(x){}App.go('home',null,true);return;}
  if(st.t)S.adminTab=st.t;App.go(st.s||'home',st.c,true);
});
async function loadCatalog(){
  const c=await S.api.getCatalog();
  S.brands=c.brands;S.products=c.products;S.banners=c.banners;S.pub=c.pub||{};
}
async function loadBase(){
  const [p]=await Promise.all([S.api.getProfile(),loadCatalog()]);
  S.profile=p;
  S.api.myNotifications().then(n=>{S.notifs=n;updateBell();}).catch(()=>{});
}
async function refreshProfile(){S.profile=await S.api.getProfile();}
// النصوص اللي تكتبها الإدارة تقدر يكون لها نسخة إنجليزية اختيارية
const tx=(o,f)=>{const v=isEN()&&o&&o.en&&o.en[f];return v||(o?o[f]:'')||'';};
const brandOf=p=>S.brands.find(b=>b.id===p?.brandId)||{name:p?.brand||'',color:p?.color,icon:p?.icon};
const fullName=p=>{const b=brandOf(p);const bn=b?tx(b,'name'):p.brand;return bn?`${bn} · ${tx(p,'name')}`:tx(p,'name');};
/* التصنيفات: تتحكم فيها الإدارة (الاسم، الأيقونة، الترتيب، الإخفاء). لو ما فيش قائمة، نبنوها من أسماء التصنيفات القديمة */
const catList=()=>{
  if(S.pub.categories?.length)return [...S.pub.categories].sort((a,b)=>(a.sort??0)-(b.sort??0));
  return [...new Set(S.brands.map(b=>b.category).filter(Boolean))].map((n,i)=>({id:n,name:n,icon:'',active:true,sort:i}));
};
const catOf=b=>{if(!b)return null;const L=catList();return L.find(c=>c.id===b.categoryId)||L.find(c=>c.id===b.category||c.name===b.category)||null;};
const catName=b=>tx(catOf(b),'name');
const catRank=b=>{const c=catOf(b);return c?(c.sort??0):9999;};
const visibleBrands=()=>S.brands.filter(b=>b.active!==false&&catOf(b)?.active!==false&&S.products.some(p=>p.brandId===b.id&&p.active))
  .sort((a,b)=>catRank(a)-catRank(b)||(a.sort??0)-(b.sort??0));
const brandItems=b=>S.products.filter(p=>p.brandId===b.id&&p.active);
const brandStock=b=>brandItems(b).reduce((a,p)=>a+Math.max(0,p.stock||0),0);
const unread=()=>{const seen=+store.get('nseen:'+S.profile?.id)||0;return S.notifs.filter(n=>ts(n.createdAt)>seen).length;};
const bar=(t,back=true,extra='')=>`<div class="hdr">${back?`<button class="ib" onclick="App.back()" aria-label="رجوع">${ic('back',18,2.1)}</button>`:''}<h1 class="title grow">${t}</h1>${extra}</div>`;
function loadInto(key,loader,tpl){
  Promise.resolve().then(loader).then(d=>{S.cache[key]=d;const el=$('#slot-'+key);if(el)el.innerHTML=tpl(d);})
  .catch(e=>{console.error(e);const el=$('#slot-'+key);if(el)el.innerHTML=`<div class="empty"><b>تعذّر التحميل</b><p>${esc(navigator.onLine?errMsg(e):'لا يوجد اتصال بالإنترنت، تأكد من الشبكة ثم أعد المحاولة')}</p><button class="btn sm ghost" onclick="App.go('${S.screen}',S.ctx)">إعادة المحاولة</button></div>`;});
}
// هوية التطبيق: الاسم، الشعار، واللون الأساسي — كلها من الإدارة
function applyBrand(){
  const c=S.pub.color;
  const r=document.documentElement;
  if(/^#[0-9a-fA-F]{6}$/.test(c||'')){r.style.setProperty('--blue',c);r.style.setProperty('--soft',c+'1a');}
  else{r.style.removeProperty('--blue');r.style.removeProperty('--soft');}

function applyTheme(){
  const dark=S.theme==='dark'||(S.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);

}

/* ================== الإجراءات (أزرار، بانرات، إشعارات) ================== */
const SCREEN_NAMES={home:'الرئيسية',wallet:'المحفظة',topup:'شحن الرصيد',orders:'الطلبات',notifications:'الإشعارات',offers:'العروض',account:'حسابي',help:'المساعدة'};
const waLink=(num,text='')=>{let d=normPhone(num);if(d.startsWith('0'))d='218'+d.slice(1);return `https://wa.me/${d}${text?`?text=${encodeURIComponent(text)}`:''}`;};
App.run=a=>{
  if(typeof a==='string'){try{a=JSON.parse(decodeURIComponent(a));}catch(e){return;}}
  if(!a||!a.type||a.type==='none')return;
  const v=a.value;
  if(a.type==='brand'){if(S.brands.some(b=>b.id===v))App.go('brand',v);else toast('هذا المنتج غير متاح حالياً');}
  else if(a.type==='category'){S.q='';S.cat=Math.max(0,cats().findIndex(c=>c.id===v||c.name===v));App.go('home');setTimeout(()=>$('#catalog')?.scrollIntoView({behavior:'smooth'}),60);}
  else if(a.type==='screen'){App.go(SCREEN_NAMES[v]?v:'home');}
  else if(a.type==='page'){if((S.pub.pages||[]).some(p=>p.id===v))App.go('page',v);}
  else if(a.type==='url'){if(/^https?:\/\//.test(v))window.open(v,'_blank','noopener');}
  else if(a.type==='whatsapp'){const num=v||S.pub.support?.whatsapp;if(num)window.open(waLink(num),'_blank','noopener');else toast('رقم الدعم غير مُعرّف');}
  else if(a.type==='call'){const num=v||S.pub.support?.phone;if(num)location.href='tel:'+normPhone(num);}
};

function startOtpTimer(){
  clearInterval(S.otpTimer);let n=60;
  const tick=()=>{const b=$('#resend');if(!b){clearInterval(S.otpTimer);return;}
    $$('.alt').forEach(x=>x.disabled=n>0);
    if(n<=0){b.disabled=false;b.textContent='إعادة الإرسال';clearInterval(S.otpTimer);}else{b.disabled=true;b.textContent=`إعادة الإرسال بعد ${n} ث`;}n--;
    trNode(b.parentElement);};
  tick();S.otpTimer=setInterval(tick,1000);setTimeout(()=>$('#otp')?.focus(),120);
}

  const P=S.pending;const r=await S.api.requestOtp(P.phone,purpose);
  Object.assign(P,{purpose,channel:r.channel,alternatives:r.alternatives||[]});goStep('otp');startOtpTimer();
}

App.phoneNext=form=>act(form.querySelector('button[type=submit]'),async()=>{
  const phone=normPhone(formData(form).phone);
  if(!validPhone(phone))throw new Error('أدخل رقم هاتف ليبي صحيح يبدأ بـ 09');
  S.pending={phone};
  if(await S.api.checkPhone(phone)){goStep('password');return;}
  if(S.pub.auth?.otp!==false){await goOtp('signup');return;}

});
App.passLogin=form=>act(form.querySelector('button[type=submit]'),async()=>{

  await S.api.signIn(S.pending.phone,pwd);
});
App.forgot=btn=>act(btn,async()=>{await goOtp('reset');});
App.resendOtp=(btn,channel)=>act(btn,async()=>{const P=S.pending;
  const r=await S.api.requestOtp(P.phone,P.purpose,channel);
  P.channel=r.channel;P.alternatives=r.alternatives||[];render();toast(`أرسلنا رمزاً جديداً ${r.channel==='whatsapp'?'على واتساب':r.channel==='telegram'?'على تيليغرام':r.channel==='sms'?'برسالة نصية':''}`,'ok');startOtpTimer();});
App.verifyOtp=form=>act(form.querySelector('button[type=submit]'),async()=>{
  const code=(form.code.value||'').trim();if(code.length!==6)throw new Error('أدخل الرمز كاملاً (6 أرقام)');
  const P=S.pending;P.ticket=await S.api.verifyOtp(P.phone,code);clearInterval(S.otpTimer);

App.register=form=>act(form.querySelector('button[type=submit]'),async()=>{
  const f=formData(form),name=(f.name||'').trim(),pwd=f.password||'',email=(f.email||'').trim(),P=S.pending;
  if(!name)throw new Error('أدخل اسمك');
  if(pwd.length<6)throw new Error('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
  if(email&&!/^\S+@\S+\.\S+$/.test(email))throw new Error('البريد الإلكتروني غير صحيح');
  S.authFlow=true;
  try{const r=P.ticket?await S.api.completeSignup({phone:P.phone,ticket:P.ticket,name,email,password:pwd}):await S.api.signUpNoOtp({name,phone:P.phone,email,password:pwd});
    if(r?.gifted)S.welcomeGift=r.gifted;}
  finally{S.authFlow=false;}
  S.pending={};await onSignedIn();
});
App.setNewPass=form=>act(form.querySelector('button[type=submit]'),async()=>{
  const f=formData(form);
  if((f.password||'').length<6)throw new Error('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
  if(f.password!==f.password2)throw new Error('كلمتا المرور غير متطابقتين');
  S.authFlow=true;
  try{await S.api.resetPassword({phone:S.pending.phone,ticket:S.pending.ticket,password:f.password});}finally{S.authFlow=false;}
  S.pending={};toast('تم تغيير كلمة المرور','ok');await onSignedIn();
});

/* ================== رمز الدخول السريع (6 أرقام) للزبون الراجع ==================
   قفل محلي على هذا الجهاز: الجلسة تبقى، والرمز يفتحها. لو نساه، يطلع ويدخل بكلمة المرور */
const PIN_KEY=()=>'pin:'+(S.profile?.id||'');
const LOCK_AFTER=5*60*1000; // يقفل من جديد لو التطبيق قعد في الخلفية أكثر من 5 دقائق
async function pinHash(pin){
  const buf=new TextEncoder().encode(PIN_KEY()+'|'+pin);
  if(crypto?.subtle){const h=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
  let h=0;for(const c of PIN_KEY()+pin)h=(h*31+c.charCodeAt(0))>>>0;return 'x'+h;
}
const hasPin=()=>!!store.get(PIN_KEY());
function pinPad(title,sub,mode){
  return `<div class="pinwrap"><div class="pinhead">${brandMark(64)}<h1 class="stitle" style="color:#fff;margin-top:14px">${title}</h1><p class="ssub" style="color:#9FB3D9">${sub}</p></div>
   <div class="pdots" id="pdots">${'<i></i>'.repeat(6)}</div>
   <div class="pkeys">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k?`<button onclick="App.pinKey('${k}','${mode}')" aria-label="${k==='⌫'?'حذف':k}">${k}</button>`:'<span></span>').join('')}</div>
   ${mode==='unlock'?`<button class="lnk pinlnk" onclick="App.pinForgot()">نسيت الرمز؟ سجّل الدخول بكلمة المرور</button>`:mode==='verify'?`<button class="lnk pinlnk" onclick="App.pinCancel()">إلغاء</button>`:`<button class="lnk pinlnk" onclick="App.pinSkip()">لاحقاً</button>`}</div>`;
}
function showPin(mode){
  S.pinBuf='';S.pinMode=mode;
  const L=document.createElement('div');L.id='pinlayer';
  const first=(S.profile?.name||'').split(' ')[0];
  L.innerHTML=mode==='unlock'?pinPad(`مرحباً ${esc(first)}`,'أدخل رمز الدخول','unlock')
    :mode==='verify'?pinPad('تأكيد العملية','أدخل رمز الدخول للمتابعة','verify')
    :mode==='set'?pinPad('رمز الدخول السريع','اختر 6 أرقام لفتح التطبيق بدلاً من كلمة المرور','set')
    :pinPad('تأكيد الرمز','أعد إدخال الأرقام نفسها','confirm');
  $('#pinlayer')?.remove();document.body.appendChild(L);trNode(L);
}
function pinDots(){$$('#pdots i').forEach((d,i)=>d.className=i<S.pinBuf.length?'f':'');}
App.pinKey=(k,mode)=>{
  if(k==='⌫'){S.pinBuf=S.pinBuf.slice(0,-1);pinDots();return;}
  if(S.pinBuf.length>=6)return;S.pinBuf+=k;pinDots();
  if(S.pinBuf.length===6)setTimeout(()=>pinDone(mode),120);
};
async function pinDone(mode){
  const pin=S.pinBuf;
  if(mode==='set'){S.pinFirst=pin;showPin('confirm');return;}
  if(mode==='confirm'){
    if(pin!==S.pinFirst){toast('الرمزان غير متطابقين، حاول مرة أخرى','bad');showPin('set');return;}
    store.set(PIN_KEY(),await pinHash(pin));store.set(PIN_KEY()+':tries','0');$('#pinlayer')?.remove();toast('تم حفظ رمز الدخول','ok');return;}
  if(mode==='verify'){
    if(await pinHash(pin)===store.get(PIN_KEY())){store.set(PIN_KEY()+':tries','0');$('#pinlayer')?.remove();const cb=S.pinCb;S.pinCb=null;if(cb)cb();return;}
    const tr=(+store.get(PIN_KEY()+':tries')||0)+1;store.set(PIN_KEY()+':tries',String(tr));
    const dd=$('#pdots');dd?.classList.add('shake');setTimeout(()=>dd?.classList.remove('shake'),400);S.pinBuf='';pinDots();
    if(tr>=5){S.pinCb=null;store.set(PIN_KEY(),'');toast('محاولات كثيرة، سجّل الدخول بكلمة المرور','bad');App.pinForgot();}
    else toast(`الرمز غير صحيح، تبقّى ${5-tr} محاولات`,'bad');
    return;}
  // فتح القفل
  if(await pinHash(pin)===store.get(PIN_KEY())){store.set(PIN_KEY()+':tries','0');S.locked=false;$('#pinlayer')?.remove();render();return;}
  const tries=(+store.get(PIN_KEY()+':tries')||0)+1;store.set(PIN_KEY()+':tries',String(tries));
  const el=$('#pdots');el?.classList.add('shake');setTimeout(()=>el?.classList.remove('shake'),400);S.pinBuf='';pinDots();
  if(tries>=5){store.set(PIN_KEY(),'');toast('محاولات كثيرة، سجّل الدخول بكلمة المرور','bad');App.pinForgot();}
  else toast(`الرمز غير صحيح، تبقّى ${5-tries} محاولات`,'bad');
}
window.__pin={hasPin,showPin,key:()=>PIN_KEY()};
App.pinSkip=()=>{store.set(PIN_KEY()+':skip','1');$('#pinlayer')?.remove();};
App.pinForgot=()=>{const ph=S.profile?.phone;store.set(PIN_KEY(),'');$('#pinlayer')?.remove();S.locked=false;
  S.authStep='password';S.pending={phone:ph};S.api.signOut();};
App.pinSettings=()=>{if(hasPin()){if(confirm('نلغي رمز الدخول السريع؟')){store.set(PIN_KEY(),'');toast('تم إلغاء الرمز');render();}}else{store.set(PIN_KEY()+':skip','');showPin('set');}};
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){S.hiddenAt=Date.now();return;}
  if(S.profile&&hasPin()&&S.hiddenAt&&Date.now()-S.hiddenAt>LOCK_AFTER&&!$('#pinlayer')){S.locked=true;showPin('unlock');}
});

async function onSignedIn(){
  if(S.signingIn)return;S.signingIn=true;
  try{await loadBase();}catch(e){console.error(e);toast(errMsg(e),'bad');S.signingIn=false;S.profile=null;S.authStep='phone';render();return;}
  finally{}
  const fromBoot=S.bootAuth;S.bootAuth=false;
  S.signingIn=false;S.authStep='phone';S.screen='home';S.sid=uid8();try{history.replaceState({s:'home',d:0,sid:S.sid},'');}catch(e){}
  render();
  // الزبون الراجع: الرمز يقفل التطبيق لما يفتحه. وبعد أول دخول نعرضوا عليه يختار رمز
  if(fromBoot&&hasPin()){S.locked=true;showPin('unlock');return;}
  setTimeout(()=>{if(new URLSearchParams(location.search).get('pay')||store.get('payPending'))checkReturnedPayment();else maybeAnnounce();
    if(!hasPin()&&!store.get(PIN_KEY()+':skip')&&!S.api.demo)setTimeout(()=>{if(!$('#layer').innerHTML)showPin('set');},900);},350);
}

      if(!S.cache.orders){S.api.myOrders().then(o=>{S.cache.orders=o;const el=$('#recentblk');if(el&&S.screen==='home'&&!S.q.trim())el.outerHTML=block(b)||'<div id="recentblk"></div>';}).catch(()=>{});return '<div id="recentblk"></div>';}

      <span class="go">اشحن</span></button></div>`;

  }}catch(e){console.error('block',b,e);}
  return '';
}
const CAT_COLORS=['#1F5FFF','#0B1F4B','#7A1FA2','#0F766E','#C2410C','#0E7490'];

function renderHomeBody(){const el=$('#homebody');if(!el)return;

const maxQty=()=>Math.max(1,Math.min(20,+S.pub.maxQty||10));
function scBrand(){
  const b=S.brands.find(x=>x.id===S.ctx);if(!b||b.active===false||catOf(b)?.active===false){S.screen='home';return scHome();}
  const items=brandItems(b),avail=items.filter(p=>p.stock>0);
  if(S.selBrand!==b.id){S.selBrand=b.id;S.selP=null;S.qty=1;}

  return `<div class="bpage">
   <div class="top2"><button class="ib" onclick="App.back()" aria-label="رجوع">${ic('back',18,2.1)}</button><button class="favbtn ${isFav(b.id)?'on':''}" id="favbtn" onclick="App.fav('${b.id}')" aria-pressed="${isFav(b.id)}" aria-label="المفضلة">${ic('star',20,1.9)}</button></div>
   <div class="brandh2"><span class="blg ${gOf(b)}">${b.image?`<img src="${esc(b.image)}" alt="">`:artIcon(b.icon,30,1.7)}</span>
    <div class="grow"><h1>${esc(tx(b,'name'))}</h1>
    <small class="${avail.length?'okc':'errc'}"><i></i>${avail.length?'متوفر · تسليم فوري':'غير متوفر حالياً'}</small></div></div>
   ${tx(b,'description')?`<div class="howto">${ic('info',16,2)}<span>${esc(tx(b,'description'))}</span></div>`:''}
   ${avail.length?'':`<div class="note soldnote">${ic('clock',18,2)}<span>نفدت جميع فئات هذا المنتج مؤقتاً، وستتوفر قريباً.</span></div>`}
   <div class="lbl2">اختر الفئة</div>
   <div class="dtiles">${items.map(x=>{const ok=x.stock>0,sale=onSale(x);return `<button class="dtile ${x.id===S.selP&&ok?'on':''}" ${ok?`onclick="App.pick('${x.id}')"`:'disabled'} aria-pressed="${x.id===S.selP}">
     ${sale&&ok?`<em>-${offPct(x)}%</em>`:''}<span class="dic ${gOf(b)}">${b.image?`<img src="${esc(b.image)}" alt="">`:artIcon(b.icon,18,1.9)}</span>
     <b>${esc(tx(x,'name'))}</b><small>${ok?`${L(eff(x))}${sale?`<s>${fmt(x.price)}</s>`:''}`:'نفذت'}</small></button>`;}).join('')}</div>
   <div style="height:150px"></div></div>
   <div class="paybar2" id="paybar">${payBar(p)}</div>`;
}
function payBar(p){
  const bal=S.profile.balance;
  if(!p) return `<div class="pinfo"><span>رصيدك</span><b>${L(bal)}</b></div><div class="pbar"><button class="btn" disabled>اختر الفئة</button></div>`;
  const max=Math.min(p.stock,maxQty());if(S.qty>max)S.qty=max;if(S.qty<1)S.qty=1;
  const price=eff(p),total=r2(price*S.qty),short=r2(total-bal);
  return `<div class="pinfo">${short>0?`<span class="errc">رصيدك ناقص ${L(short)}</span><b>${L(bal)}</b>`:`<span>رصيدك بعد الشراء</span><b>${L(bal-total)}</b>`}</div>
   <div class="pbar"><div class="qty2"><button onclick="App.qty(1)" ${S.qty>=max?'disabled':''} aria-label="زيادة">+</button><span class="num" aria-live="polite">${S.qty}</span><button onclick="App.qty(-1)" ${S.qty<=1?'disabled':''} aria-label="نقص">−</button></div>
   ${short>0?`<button class="btn" onclick="S.topAmount=${Math.ceil(short)};App.go('topup')">اشحن المحفظة<small>الإجمالي ${L(total)}</small></button>`
     :`<button class="btn" id="buyBtn" onclick="App.buy(this)">اشترِ ${S.qty>1?S.qty+' × ':''}${esc(tx(p,'name'))}<small>الإجمالي ${L(total)}</small></button>`}</div>`;
}
const refreshPay=()=>{const el=$('#paybar');if(!el)return;const p=S.products.find(x=>x.id===S.selP);el.innerHTML=payBar(p&&p.stock>0?p:null);trNode(el);};
App.pick=pid=>{S.selP=pid;S.qty=1;$$('.dtile').forEach(t=>t.classList.toggle('on',t.getAttribute('onclick')===`App.pick('${pid}')`));refreshPay();};
App.qty=d=>{S.qty+=d;refreshPay();};
App.soldOut=()=>toast('هذه الفئة نفدت مؤقتاً');
// الانتقال لفئة معيّنة (من العروض أو «اشترِ من جديد») يفتح صفحة المنتج والفئة مختارة
App.openPack=pid=>{const p=S.products.find(x=>x.id===pid);if(!p)return;S.selBrand=p.brandId;S.selP=pid;S.qty=1;App.go('brand',p.brandId);};
App.buy=btn=>{
  const p=S.products.find(x=>x.id===S.selP);if(!p||btn.disabled)return;
  const price=eff(p),qty=S.qty,name=fullName(p);
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  act(null,async()=>{
    let r;
    try{r=await S.api.purchase(p.id,price,qty);}
    catch(e){await Promise.all([refreshProfile(),loadCatalog()]).catch(()=>{});render();throw e;}
    const ids=r.orderIds||[r.orderId];
    const codes=await Promise.all(ids.map(id=>S.api.revealCode(id).catch(()=>null)));
    await Promise.all([refreshProfile(),loadCatalog()]);
    S.cache.orders=null;S.selP=null;S.qty=1;
    S.last={productName:name,qty:ids.length,price:r.price??price,total:r.total??price*ids.length,orders:ids.map((id,i)=>({id,code:codes[i]}))};
    App.go('done');
  }).finally(()=>{if(document.contains(btn)){btn.disabled=false;refreshPay();}});
};
function scPack(){const p=S.products.find(x=>x.id===S.ctx);if(p){S.selBrand=p.brandId;S.selP=p.id;S.ctx=p.brandId;S.screen='brand';return scBrand();}S.screen='home';return scHome();}

function scOffers(){
  const list=S.products.filter(p=>p.active&&onSale(p)&&brandOf(p).active!==false).sort((a,b)=>(a.saleEnds||9e15)-(b.saleEnds||9e15));
  if(!list.length) return bar('العروض')+`<div class="empty"><b>لا توجد عروض حالياً</b><p>تابع الإشعارات لتصلك العروض القادمة أولاً بأول.</p><button class="btn" onclick="App.go('home')">تصفّح المتجر</button></div>`;
  const soon=list.find(p=>p.saleEnds);
  return bar('العروض')+
   `${soon?`<div class="offhead"><b>عروض تنتهي قريباً</b><span class="cd">${ic('clock',13,2.2)} ${leftText(soon.saleEnds)}</span></div>`:''}
    <div class="olist">${list.map(p=>{const b=brandOf(p),ok=p.stock>0;
      return `<button class="ocrd ${ok?'':'out'}" onclick="${ok?`App.openPack('${p.id}')`:'App.soldOut()'}">
       <span class="ol ${gOf(b)}">${b.image?`<img src="${esc(b.image)}" alt="">`:artIcon(b.icon,22,1.8)}</span>

       <div class="pr"><b>${L(eff(p))}</b><s>${fmt(p.price)}</s></div></div>
       <em>-${offPct(p)}%</em></button>`;}).join('')}</div>`;
}

App.oSearch=v=>{S.oq=v;const el=$('#slot-orders'),list=S.cache.orders||[],q=v.trim();

/* ================== المحفظة والشحن ================== */
const TOPUP_STATUS={pending:['بانتظار التأكيد','b-warn'],approved:['تمت الإضافة','b-ok'],rejected:['مرفوض','b-err']};
const LEDGER_ICON={purchase:'bag',topup:'plus',gift:'gift',bonus:'gift',refund:'plus',adjust:'edit'};
const gwList=()=>(S.pub.gatewayList||DEFAULT_GATEWAYS.map(g=>({...g,active:!!S.pub.gateways?.[g.id]}))).slice().sort((a,b)=>(a.sort??0)-(b.sort??0));
const methodName=m=>m==='bank'?'تحويل مصرفي':(tx(gwList().find(g=>g.id===m),'name')||m||'');
/* ================== المحفظة: رصيد + أزرار + متابعة الشحن + عمليات مجمّعة ================== */
const hideBal=()=>store.get('hidebal')==='1';
App.toggleBal=()=>{store.set('hidebal',hideBal()?'0':'1');render();};
const dayLabel=t=>{const d=new Date(ts(t)),n=new Date(),s=new Date(n);s.setHours(0,0,0,0);
  if(ts(t)>=s.getTime())return 'اليوم';
  if(ts(t)>=s.getTime()-864e5)return 'أمس';
  return d.toLocaleDateString(isEN()?'en-GB':'ar-LY-u-nu-latn',{day:'numeric',month:'long'});};
const txRow=l=>`<div class="tx"><span class="ti ${l.amount>0?'pos':''} ${l.pending?'pend':''}">${ic(l.pending?'clock':(LEDGER_ICON[l.type]||'wallet'),17,2)}</span>
  <div class="grow"><b>${esc(l.note||(l.type==='topup'?'شحن رصيد':l.type))}</b><small>${fdate(l.createdAt)}${l.sub?' · '+esc(l.sub):''}</small></div>
  <b class="am ${l.amount>0?'pos':''}" style="direction:ltr;unicode-bidi:bidi-override">${l.amount>0?'+':'−'}${fmt(Math.abs(l.amount))}</b></div>`;
function groupTx(list){
  let out='',last='';
  list.forEach(l=>{const d=dayLabel(l.createdAt);if(d!==last){out+=`${last?'</div>':''}<div class="sh">${esc(d)}</div><div class="txl">`;last=d;}out+=txRow(l);});
  return out+(last?'</div>':'');
}
function scWallet(){
  loadInto('wallet',()=>Promise.all([S.api.myTopups(),S.api.myLedger(),refreshProfile()]),([tops,led])=>{
    const wb=$('#wbal');if(wb)wb.textContent=hideBal()?'••••':fmt(S.profile.balance);
    const open=tops.filter(t=>t.status==='pending')[0];
    const rej=tops.filter(t=>t.status==='rejected')[0];
    const track=open?`<div class="track"><div class="trh">${ic('clock',16,2.2)}<b>شحن ${L(open.amount)} قيد المراجعة</b></div>
      <div class="tl"><span class="d on"></span><i class="on"></i><span class="d on"></span><i></i><span class="d"></span></div>
      <div class="tll"><small>أُرسل</small><small class="now">قيد المراجعة</small><small>أُضيف</small></div></div>`
      :rej&&Date.now()-ts(rej.createdAt)<3*864e5?`<div class="track rej"><div class="trh">${ic('info',16,2.2)}<b>طلب شحن ${L(rej.amount)} مرفوض</b></div>
      <p class="mut small" style="margin:6px 0 0">${esc(rej.reason||'راجع بيانات التحويل وحاول مرة ثانية')}</p></div>`:'';
    return track+(led.length?`<div class="shr"><b>آخر العمليات</b>${led.length>20?`<button class="more" onclick="App.go('ledger')">الكل</button>`:''}</div>`+groupTx(led.slice(0,20))+(led.length>20?`<button class="btn sec" style="margin-top:12px" onclick="App.go('ledger')">كشف الحساب كامل</button>`:'')
      :'<div class="empty" style="padding:40px"><b>لا توجد عمليات</b><p>ستظهر هنا أول عملية شحن أو شراء.</p></div>');});
  const hid=hideBal();
  return bar('المحفظة',false)+
  `<div class="pcard">
    <div class="pc-top">${S.pub.logo?`<span class="pc-logo"><img src="${esc(S.pub.logo)}" alt=""></span>`:`<span class="pc-brand">${esc(brandName()).toUpperCase()}</span>`}
     <button class="pc-eye" onclick="App.toggleBal()" aria-label="إظهار أو إخفاء الرصيد">${ic(hid?'eye':'eyeoff',17,2)}</button></div>
    <div class="pc-mid"><div class="pc-bal"><small>الرصيد</small><b><span id="wbal">${hid?'••••':fmt(S.profile.balance)}</span> د.ل</b></div><span class="pc-chip"></span></div>
    <div class="pc-bot"><small>${esc(S.profile.name||'')}</small>
     <button class="pc-add" onclick="App.go('topup')">${ic('plus',15,2.6)} شحن</button></div>
    <span class="pc-st s1"></span><span class="pc-st s2"></span></div>
   <div id="slot-wallet"><div class="loader"></div></div>`;
}
function scLedger(){
  const only=S.ctx==='gift';
  const tpl=led=>{const list=only?led.filter(l=>['gift','bonus'].includes(l.type)):led;
    return list.length?groupTx(list):`<div class="empty"><b>${only?'لم تصلك هدايا بعد':'لا توجد عمليات'}</b><p>${only?'تظهر هنا الهدايا والجوائز.':'ستظهر هنا أول عملية شحن أو شراء.'}</p></div>`;};

function scMyTopups(){
  const tpl=list=>list.length?`<div class="list">${list.map(t=>`<div class="row"><span class="ico soft">${ic(t.status==='pending'?'clock':t.status==='approved'?'check':'info',19,2)}</span>
    <span class="grow"><b>شحن ${L(t.amount)}</b><small>${methodName(t.method)} · ${fdate(t.createdAt)}${t.status==='rejected'&&t.reason?` · ${esc(t.reason)}`:''}</small></span>
    <span class="badge ${TOPUP_STATUS[t.status]?.[1]}">${TOPUP_STATUS[t.status]?.[0]||esc(t.status)}</span></div>`).join('')}</div>`

/* ================== الشحن: المبلغ ثم الطريقة في شاشة وحدة ================== */
function methods(){
  const b=S.pub.bank||{};
  return [...gwList().filter(g=>g.active).map(g=>({id:g.id,name:tx(g,'name'),detail:tx(g,'note')||fieldsSummary(g),eta:'فوري',fast:true,icon:'card',logo:g.logo})),
    ...((b.account||b.iban)?[{id:'bank',name:'تحويل مصرفي',detail:'تحويل ثم رفع الإيصال',eta:'بعد المراجعة',fast:false,icon:'bank'}]:[])];
}
function scTopup(){
  const ms=methods();
  if(!ms.length) return bar('شحن الرصيد')+`<div class="empty"><b>الشحن غير متاح حالياً</b><p>يُرجى المحاولة لاحقاً أو التواصل معنا.</p></div>`;
  const last=store.get('lastMethod');
  return bar('شحن الرصيد')+`<div class="lbl2">اختر طريقة الشحن</div>
   <div class="mlist">${ms.map(m=>`<button class="mrow" onclick="App.openMethod('${m.id}')">
     <span class="mic ${m.logo?'logo':m.fast?'g4':'g2'}">${m.logo?`<img src="${esc(m.logo)}" alt="">`:ic(m.icon,18,2)}</span>
     <span class="grow"><b>${esc(m.name)}${last===m.id?'<em class="lastm">الطريقة المعتادة</em>':''}</b><small>${esc(m.detail)}</small></span>
     <span class="eta"><b class="${m.fast?'fastc':'slowc'}">${esc(m.eta)}</b></span>${ic('chev',16,2.2)}</button>`).join('')}</div>`;
}
// حقول كل بوابة كما تعرّفها الإدارة، والمبلغ يُكتب دائمًا
const gwFields=g=>(g?.fields||[]).filter(f=>f&&f.label);
const fieldsSummary=g=>{const f=gwFields(g);return f.length?f.map(x=>x.label).concat('المبلغ').join(' و'):'المبلغ فقط';};
App.openMethod=id=>{store.set('lastMethod',id);S.payMethod=id;S.gwVals={};S.topAmount=0;
  if(id==='bank'){S.bankStep=1;App.go('bank');return;}App.go('gwpay',id);};
function scGwPay(){
  const g=gwList().find(x=>x.id===S.ctx&&x.active);if(!g){S.screen='topup';return scTopup();}
  const t=S.pub.topup||{},fs=gwFields(g),v=S.gwVals||{};
  const fld=(f,i)=>{const k=f.key||('f'+i);
    return `<label class="f gwf"><span>${esc(f.label)}${f.required===false?' <i class="opt">(اختياري)</i>':''}</span>
    <input name="${esc(k)}" type="text" ${f.type==='number'?'inputmode="numeric" dir="ltr"':''} ${f.len?`maxlength="${+f.len}"`:''}
     placeholder="${esc(f.placeholder||'')}" value="${esc(v[k]||'')}" oninput="App.gwVal('${esc(k)}',this.value)"></label>`;};
  return bar(tx(g,'name'))+
   `<div class="gwhead ${g.logo?'img':''}" ${g.logo?'':`style="background:${esc(g.color||'#0B1F4B')}"`}>
     ${g.logo?`<img src="${esc(g.logo)}" alt="${esc(tx(g,'name'))}">`:`<b>${esc(tx(g,'name'))}</b>`}</div>
    <form onsubmit="event.preventDefault();App.gwSubmit(this)">
     ${fs.map(fld).join('')}
     <label class="f gwf"><span>المبلغ</span><span class="amtwrap"><input name="amount" type="number" inputmode="decimal" min="1" dir="ltr" placeholder="0" value="${S.topAmount||''}" oninput="App.gwAmt(this.value)"><i>د.ل</i></span></label>
     ${t.min||t.max?`<p class="amthint">${t.min?`الحد الأدنى ${t.min} د.ل`:''}${t.min&&t.max?' · ':''}${t.max?`الحد الأعلى ${t.max} د.ل`:''}</p>`:''}
     ${tx(g,'hint')?`<div class="hintbox">${ic('info',16,2)}<span>${esc(tx(g,'hint'))}</span></div>`:''}
     ${g.mode==='redirect'?`<div class="hintbox ok">${ic('shield',16,2)}<span>ستُحوَّل إلى صفحة الدفع الآمنة لإتمام العملية.</span></div>`:''}
     <div style="height:110px"></div>
     <div class="dock low"><button class="btn" type="submit">${g.mode==='redirect'?'متابعة إلى صفحة الدفع':'تأكيد الشحن'}${S.topAmount>0?` · ${L(S.topAmount)}`:''}</button></div>
    </form>`;
}
App.gwVal=(k,v)=>{S.gwVals={...(S.gwVals||{}),[k]:v};};
App.gwAmt=v=>{S.topAmount=r2(v);const b=$('.dock .btn');if(!b)return;
  const g=gwList().find(x=>x.id===S.ctx);
  b.textContent=`${g?.mode==='redirect'?'متابعة إلى صفحة الدفع':S.screen==='bank'?'التالي':'تأكيد الشحن'}${S.topAmount>0&&S.screen!=='bank'?` · ${L(S.topAmount)}`:''}`;trNode(b.parentElement);};
App.gwSubmit=form=>act(form.querySelector('button[type=submit]'),async()=>{
  const g=gwList().find(x=>x.id===S.ctx);if(!g)return;
  const f=formData(form),fields={};
  gwFields(g).forEach((fd,i)=>{const k=fd.key||('f'+i),val=String(f[k]||'').trim();
    if(fd.required!==false&&!val)throw new Error(`${fd.label} مطلوب`);
    if(val&&fd.type==='number'&&!/^[0-9]+$/.test(val))throw new Error(`${fd.label} يجب أن يكون أرقاماً فقط`);
    if(val&&fd.len&&val.length!==+fd.len)throw new Error(`${fd.label} يجب أن يتكوّن من ${fd.len} خانات`);
    fields[k]=val;});
  if(!checkAmount())return;
  await App.payGateway(g.id,null,fields);
});
const checkAmount=()=>{const t=S.pub.topup||{},a=S.topAmount;
  if(!(a>0)){toast('أدخل المبلغ');$('input[name=amount]')?.focus();return false;}
  if(t.min&&a<t.min){toast(`الحد الأدنى للشحن ${t.min} د.ل`);return false;}
  if(t.max&&a>t.max){toast(`الحد الأعلى للشحن ${t.max} د.ل`);return false;}return true;};
App.bankAmt=()=>{if(!checkAmount())return;S.bankStep=2;render();};
App.payGateway=async(gid,btn,fields)=>{
  const run=async()=>{
  const r=await S.api.startGatewayTopup(gid,S.topAmount,fields);
  S.topAmount=0;
  if(r.url){store.set('payPending',r.paymentId);location.href=r.url;return;}
  if(r.paymentId){waitPayment(r.paymentId,r.message);return;}
  App.close();await refreshProfile();toast('تمت إضافة المبلغ إلى رصيدك','ok');App.go('wallet');};
  return btn?act(btn,run):run();};
// بعد الدفع: نستنو تأكيد البوابة (عادة ثواني) ونحدّثوا الرصيد
function waitPayment(pid,message){
  if(!pid||S.waitingPay===pid)return;S.waitingPay=pid;
  sheet(`<div style="text-align:center"><div class="loader" style="margin:10px auto 18px"></div><h3 class="shh" style="justify-content:center">جارٍ تأكيد الدفع</h3>
    <p class="mut" style="margin-top:8px;line-height:1.8">${esc(message||'بمجرد تأكيد البوابة للعملية، يُضاف الرصيد إلى محفظتك تلقائياً.')}</p>
    <button class="btn sec" style="margin-top:18px" onclick="App.close()">إخفاء · سيُضاف الرصيد تلقائياً</button></div>`);
  const t0=Date.now();
  const tick=async()=>{
    let p=null;try{p=await S.api.paymentStatus(pid);}catch(e){}
    if(p?.status==='paid'){store.set('payPending','');S.waitingPay=null;App.close();await refreshProfile().catch(()=>{});toast(`تم شحن ${fmt(p.amount)} د.ل لمحفظتك`,'ok');App.go('wallet');return;}
    if(p&&['failed','mismatch','cancelled'].includes(p.status)){store.set('payPending','');S.waitingPay=null;App.close();toast('لم تتم عملية الدفع. إذا خُصم منك مبلغ فتواصل مع الدعم','bad');return;}
    if(Date.now()-t0>120000){S.waitingPay=null;return;}
    setTimeout(tick,3000);};
  setTimeout(tick,1500);
}
function checkReturnedPayment(){
  const q=new URLSearchParams(location.search),pid=q.get('pay')||store.get('payPending');
  if(q.get('pay')){try{history.replaceState(history.state,'',location.pathname);}catch(e){}}
  if(pid)waitPayment(pid);
}
function bankSteps(step){
  return `<div class="steps"><span class="on">1</span><i class="${step>=2?'on':''}"></i><span class="${step>=2?'on':''}">2</span><i class="${step>=3?'on':''}"></i><span class="${step>=3?'on':''}">3</span></div>
   <div class="stl"><small class="${step===1?'now':''}">المبلغ</small><small class="${step===2?'now':''}">حوّل</small><small class="${step===3?'now':''}">الإيصال</small></div>`;
}
function scBank(){
  const b=S.pub.bank||{},tp=S.pub.topup||{};
  let step=S.bankStep||1; if(step>1&&!(S.topAmount>0)){step=S.bankStep=1;}
  if(step===1) return bar('تحويل مصرفي')+bankSteps(1)+

function render(){
  applyTheme();applyBrand();applyLang();

  clearInterval(heroTimer);
  if(!S.profile){v.className='bleed';v.innerHTML=scAuth();nav.className='nav hide';shell.className='app';return;}
  if(S.pub.maintenance?.active&&!S.profile.isAdmin){v.className='';v.innerHTML=scMaintenance();nav.className='nav hide';shell.className='app';return;}
  const SC={home:scHome,brand:scBrand,pack:scPack,done:scDone,orders:scOrders,order:scOrder,wallet:scWallet,topup:scTopup,bank:scBank,
    pending:scPending,gwpay:scGwPay,ledger:scLedger,mytopups:scMyTopups,account:scAccount,notifications:scNotifications,offers:scOffers,page:scPage,help:scHelp,terms:scTerms,admin:viewAdmin};

  if(S.screen==='admin')v.firstElementChild?.setAttribute('data-notr','1');
  v.setAttribute('dir',S.screen==='admin'?'rtl':'');
  v.className='';
  shell.className='app'+(S.screen==='admin'?' wide':'');
  const hide=['brand','pack','done','pending','bank','gwpay'].includes(S.screen);
  nav.className='nav'+(hide?' hide':'');
  const cur=TABOF[S.screen]||S.screen;
  const items=S.profile.isAdmin?[...TABBAR,['admin','الإدارة','shield']]:TABBAR;
  nav.innerHTML=items.map(t=>`<button onclick="App.go('${t[0]}')" data-on="${cur===t[0]?1:0}" ${cur===t[0]?'aria-current="page"':''}>${ic(t[2],22)}<span>${t[1]}</span></button>`).join('');
  if(S.screen!=='admin')trNode(v);
  bindHero();
}
function bindHero(){
  clearInterval(heroTimer);
  const hero=$('#hero');if(!hero)return;
  const n=hero.children.length;if(n<2)return;
  const W=()=>hero.children[0].getBoundingClientRect().width+12;
  const sync=()=>{const i=Math.min(Math.round(Math.abs(hero.scrollLeft)/W()),n-1);
    $$('.dots i').forEach((d,j)=>d.className=j===i?'on':'');S.hero=i;};
  hero.addEventListener('scroll',sync,{passive:true});
  let paused=false;hero.addEventListener('touchstart',()=>{paused=true;setTimeout(()=>paused=false,8000);},{passive:true});
  S.hero=0;
  heroTimer=setInterval(()=>{if(S.screen!=='home'||paused||!document.contains(hero))return;const i=(S.hero+1)%n;
    hero.scrollTo({left:-i*W(),behavior:'smooth'});setTimeout(sync,400);},5000);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='system')render();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.profile&&S.api&&S.screen!=='admin'){

// ترجمة ما يُعرض: نمشوا على النصوص وبعض الخصائص، ونتجاهلوا لوحة الإدارة (بالعربي دائمًا)
function trNode(root) {
  if (!isEN() || !root) return;
  const skip = n => n.closest && n.closest('[data-notr]');
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => (n.parentElement && !skip(n.parentElement) && /[\u0600-\u06FF]/.test(n.nodeValue)) ? 1 : 2,
  });
  const list = [];
  while (walker.nextNode()) list.push(walker.currentNode);
  list.forEach(n => { const v = trText(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; });
  const els = root.querySelectorAll ? root.querySelectorAll('[placeholder],[aria-label],[title]') : [];
  els.forEach(el => {
    if (skip(el)) return;
    ['placeholder', 'aria-label', 'title'].forEach(a => {
      const v = el.getAttribute(a);
      if (v && /[\u0600-\u06FF]/.test(v)) { const t = trText(v); if (t !== v) el.setAttribute(a, t); }
    });
  });
}

  .observe(document.body, {childList: true, subtree: true});

function actionField(prefix,a={}){

function actionValue(prefix,t,v=''){

async function reorder(list,id,dlt,save){
  const i=list.findIndex(x=>x.id===id),j=i+dlt;if(i<0||j<0||j>=list.length)return;
  [list[i],list[j]]=[list[j],list[i]];
  await Promise.all(list.map((x,k)=>x.sort===k?null:save({id:x.id,sort:k})));
}

App.saveCat=(form,cid)=>act(form.querySelector('button[type=submit]'),async()=>{

  const id=cid||'c'+uid8(),item={id,en:enOf(f,['name']),name,icon:yes(f.noicon)?'':(f.icon||''),active:yes(f.active)};
  const i=L.findIndex(c=>c.id===id);if(i>=0)L[i]={...L[i],...item};else L.push({...item,sort:L.length});
  await saveCats(L);
  // توزيع المنتجات: المعلّمة تنتقل لهذا التصنيف، واللي انشالت منه تصير بدون تصنيف
  const ops=[];
  for(const b of S.brands){const on=yes(f['b_'+b.id]),cur=catOf(b)?.id;

    else if(on&&b.category!==name)ops.push(S.api.saveBrand({id:b.id,categoryId:id,category:name}));}
  await Promise.all(ops);await refreshFront();App.close();toast('تم حفظ التصنيف','ok');ADMIN.catalog();
});

  </form>`);
  App.bulkCount($('#layer form'));
};
const bulkScope=scope=>S.products.filter(p=>scope==='all'||(scope.startsWith('c:')&&catOf(brandOf(p))?.id===scope.slice(2))||(scope.startsWith('b:')&&p.brandId===scope.slice(2)));
App.bulkCount=form=>{const f=formData(form);const n=bulkScope(f.scope).length;const pct=+f.pct||0;
  $('#bs-count').textContent=`${n} فئة${pct?` · مثال: كرت بـ 100 د.ل يصير بـ ${fmt(Math.round(100*(1-pct/100)/(+f.round||1))*(+f.round||1))} د.ل`:''}`;};
App.applyBulkSale=(form,submitter)=>act(submitter,async()=>{
  const f=formData(form),list=bulkScope(f.scope),clear=submitter?.value==='clear';
  if(!list.length)throw new Error('ما فيه فئات في هذا النطاق');
  const pct=+f.pct,step=+f.round||1,ends=toMs(f.ends);
  if(!clear&&!(pct>0&&pct<90))throw new Error('نسبة الخصم غير صحيحة');
  if(!clear&&ends&&ends<Date.now())throw new Error('تاريخ النهاية فات');
  await Promise.all(list.map(p=>S.api.saveProduct(clear?{id:p.id,salePrice:0,saleEnds:0}
    :{id:p.id,salePrice:Math.max(0.01,Math.round(p.price*(1-pct/100)/step)*step),saleEnds:ends||0})));
  App.close();toast(clear?`تم إلغاء العروض على ${list.length} فئة`:`تم تطبيق خصم ${pct}% على ${list.length} فئة`,'ok');await refreshFront();ADMIN.catalog();
});

ADMIN.stock=()=>adminLoad(async()=>{
  const [batches]=await Promise.all([S.api.listBatches(),loadCatalog()]);
  const prods=S.products;
  const sel_=S.cache.stockProduct||prods[0]?.id;
  body(`<div class="admin-grid cols">
  <form class="card" onsubmit="event.preventDefault();App.addBatch(this)" oninput="App.batchCalc(this)">
    <h3 style="margin-bottom:14px">إضافة دفعة أكواد</h3>
    ${prods.length?`
    ${fld('الفئة',`<select name="productId" onchange="S.cache.stockProduct=this.value">${S.brands.map(b=>{const ps=prods.filter(p=>p.brandId===b.id);return ps.length?`<optgroup label="${esc(b.name)}">${ps.map(p=>`<option value="${p.id}" ${p.id===sel_?'selected':''}>${esc(p.name)} (مخزون ${p.stock})</option>`).join('')}</optgroup>`:'';}).join('')}</select>`)}
    <div class="two">${fld('تكلفة الكرت الواحد (د.ل)',num('unitCost','','required min="0.01" step="any"'))}${fld('المورد',inp('supplier',S.cache.lastSupplier||'بلو كارد'))}</div>
    ${fld('الأكواد (كل كود في سطر)','<textarea name="codes" required placeholder="XXXX-XXXX-XXXX"></textarea>')}
    <p class="note info small" id="b-sum" style="margin-bottom:14px">الصق الأكواد لحساب التكلفة.</p>
    <button class="btn" type="submit">أضف الأكواد للمخزون</button>`:'<div class="empty">أضف منتج وفئة أولًا من «المنتجات والعروض».</div>'}
  </form>
  <div><h3 class="section-title" style="margin-top:0">الدفعات</h3>
  <div class="list">${batches.map(b=>`<div class="item"><div class="grow"><div class="t">${esc(b.productName)}</div>
    <div class="muted tiny">${fdate(b.createdAt)} · ${esc(b.supplier||'')} · <span class="num">${fmt(b.unitCostLYD)}</span> د.ل للكرت · الإجمالي <span class="num">${fmt(b.totalLYD)}</span></div></div>
    <div style="text-align:left"><div class="num">${b.remaining}/${b.qty}</div><div class="muted tiny">متبقي</div></div></div>`).join('')||'<div class="empty">ما فيه دفعات للآن.</div>'}</div></div>
  </div>`);
  const form=$('#admin-body form');if(form?.productId)App.batchCalc(form);
});
App.batchCalc=form=>{
  if(!form?.productId)return;
  const p=S.products.find(x=>x.id===form.productId.value);if(!p)return;
  const codes=form.codes.value.split('\n').map(s=>s.trim()).filter(Boolean);
  const dup=codes.length-new Set(codes).size;
  const unit=+form.unitCost.value||0,price=eff(p);
  const margin=price>0&&unit?Math.round((price-unit)/price*1000)/10:null;
  $('#b-sum').innerHTML=codes.length
    ?`${codes.length} كود · تكلفة الكرت <b class="num">${fmt(unit)}</b> د.ل · الإجمالي <b class="num">${fmt(unit*codes.length)}</b> د.ل${margin!==null?` · الهامش <b class="num ${margin<(S.cache.priv?.marginAlertPct??8)?'minus':''}">${margin}%</b>`:''}${dup?`<br><span class="minus">فيه ${dup} كود مكرر، احذفه قبل الإضافة</span>`:''}`
    :'الصق الأكواد لحساب التكلفة.';
};
App.addBatch=form=>act(form.querySelector('button[type=submit]'),async()=>{
  const codes=form.codes.value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(new Set(codes).size!==codes.length)throw new Error('فيه أكواد مكررة داخل الدفعة');
  S.cache.lastSupplier=form.supplier.value.trim();S.cache.stockProduct=form.productId.value;
  const r=await S.api.addBatch({productId:form.productId.value,codes,unitCost:+form.unitCost.value,supplier:form.supplier.value.trim()});
  toast(`تمت إضافة ${r.added} كود للمخزون`,'ok');await refreshFront();ADMIN.stock();
});

ADMIN.sales=()=>adminLoad(async()=>{
  const orders=S.cache.allOrders=await S.api.listOrders();
  const range=S.cache.salesRange||'today';
  const since=range==='today'?startOfDay():range==='week'?Date.now()-7*864e5:range==='month'?Date.now()-30*864e5:0;
  const list=orders.filter(o=>ts(o.createdAt)>=since);
  const ok=list.filter(o=>o.status!=='refunded');
  const sum=ok.reduce((a,o)=>a+o.price,0),prof=ok.reduce((a,o)=>a+o.profit,0);
  const by={};ok.forEach(o=>{const k=o.productName;(by[k]||={n:0,s:0,p:0});by[k].n++;by[k].s+=o.price;by[k].p+=o.profit;});
  const top=Object.entries(by).sort((a,b)=>b[1].s-a[1].s).slice(0,8);
  body(`<div class="tabs">${[['today','اليوم'],['week','7 أيام'],['month','30 يوم'],['all','الكل']].map(([k,l])=>`<button class="tab ${k===range?'on':''}" onclick="S.cache.salesRange='${k}';ADMIN.sales()">${l}</button>`).join('')}</div>
  <div class="stats" style="margin-bottom:14px">
    <div class="stat"><span class="muted small">المبيعات</span><b>${fmt(sum)}</b><span class="muted tiny">${ok.length} عملية</span></div>
    <div class="stat"><span class="muted small">الربح</span><b>${fmt(prof)}</b><span class="muted tiny">هامش ${sum?Math.round(prof/sum*1000)/10:0}%</span></div>
    <div class="stat"><span class="muted small">التكلفة</span><b>${fmt(sum-prof)}</b></div>
    <div class="stat"><span class="muted small">مسترجع</span><b>${list.length-ok.length}</b></div></div>
  ${top.length?`<h3 class="section-title" style="margin-top:0">الأكثر مبيعًا</h3><div class="list">${top.map(([k,v])=>`<div class="item"><div class="grow"><div class="t">${esc(k)}</div><div class="muted tiny">${v.n} عملية · ربح <span class="num">${fmt(v.p)}</span></div></div><b>${money(v.s)}</b></div>`).join('')}</div>`:''}
  <h3 class="section-title">العمليات</h3>
  <div class="list">${list.map(o=>`<button class="item" onclick="App.orderAdmin('${o.id}')"><div class="grow"><div class="t">${esc(o.productName)} ${o.status==='refunded'?'<span class="pill warn">مسترجع</span>':''}</div>

});

function loadOrderTimeline(o){

    const steps=[['تم الطلب',fdate(o.createdAt),true],['تم خصم الرصيد من محفظة الزبون',L(o.price)+' · '+fdate(o.createdAt),true],
      [o.status==='refunded'?'تم استرجاع القيمة':'تسليم الكود',o.status==='refunded'?'أُعيد الرصيد للزبون':'تلقائي · '+fdate(o.createdAt),true],
      ['عرض الزبون للكود',firstCust?fdate(firstCust.at):'لم يفتحه الزبون بعد',!!firstCust]];
    box.innerHTML=steps.map(([t,s,on])=>`<div class="otlrow"><span class="otld ${on?'on':''}">${on?ic('check',12,'#fff',3):''}</span><div class="g"><b>${t}</b><small>${esc(s)}</small></div></div>`).join('');
